<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DINO RUNNER</title><style>html{background:#0f171c;min-height:100%}body{min-height:100vh}.voltar{position:fixed;left:10px;bottom:10px;z-index:99999;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:12px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)}</style></head><style>

:root{
  --accent-a:#8b6cf0;
  --accent-b:#4fa8e0;
  --ink:#f2f5f7;
  --ink-dim:rgba(242,245,247,.55);
  --ink-faint:rgba(242,245,247,.4);
}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{width:100%;max-width:620px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,rgba(34,45,53,.97),rgba(24,33,40,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.head{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--accent-b);opacity:.85}
.title{font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.value{font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;font-variant-numeric:tabular-nums}
.label{font-size:8px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-bottom:3px}
.main{padding:16px}
.board{position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),rgba(0,0,0,0) 60%),rgba(4,9,12,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;margin-top:12px;justify-content:center}
.button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;background:rgba(255,255,255,.06);padding:0 16px;transition:transform .08s ease,filter .08s ease}
.button:active{transform:scale(.94);filter:brightness(1.15)}
.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(139,108,240,.35)}
.status{text-align:center;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);letter-spacing:.3px;margin-top:12px;min-height:12px}
.overlay{position:absolute;inset:0;background:rgba(10,15,19,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;animation:fade-in .18s ease}
.overlay.hidden{display:none}
.overlay-title{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#fff,var(--accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.2px;margin-top:8px;max-width:280px}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

body{cursor:pointer}
</style>
<body>
<div class="wrap">
<div class="card">
<div class="head">
<div><div class="brand">MSNK7BOT</div><div class="title">DINO RUNNER</div></div>
<div class="stats"><div><div class="label">PONTOS</div><div class="value" id="score">00000</div></div><div><div class="label">RECORDE</div><div class="value" id="best">00000</div></div></div>
</div>
<div class="main">
<div class="board" id="board">
<canvas id="game" width="560" height="420"></canvas>
<div id="overlay" class="overlay"><div id="gameTitle" class="overlay-title">DINO RUNNER</div><div id="gameSub" class="overlay-sub">TOQUE PARA PULAR &#8226; DESVIE DOS CACTOS</div><button id="start" class="button primary" style="margin-top:15px">COME&#199;AR</button></div>
</div>
<div id="status" class="status">BEST 00000 &#8226; VELOCIDADE 1.0x</div>
</div>
</div>
</div>
<script>
const c=document.getElementById('game');
const x=c.getContext('2d');
const board=document.getElementById('board');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const statusEl=document.getElementById('status');
const overlay=document.getElementById('overlay');
const gameTitle=document.getElementById('gameTitle');
const gameSub=document.getElementById('gameSub');
const start=document.getElementById('start');

let obstacles=[];
let clouds=[];
let particles=[];
let score=0;
let best=0;
let playing=false;
let last=0;
const BASE_SPEED=3.4;
let speed=BASE_SPEED;
let spawn=100;
let ground=365;
let dino={x:55,y:329,w:28,h:36,vy:0,onGround:true,step:0};

try{best=parseInt(localStorage.getItem('takeshi_dino_best')||'0',10)||0}catch(e){best=0}

function pad(value){return String(Math.floor(value)).padStart(5,'0')}

function updateUI(){
scoreEl.textContent=pad(score);
bestEl.textContent=pad(best);
statusEl.textContent='BEST '+pad(best)+' • VELOCIDADE '+(speed/BASE_SPEED).toFixed(1)+'x';
}

function seedClouds(){
clouds=[];
for(let i=0;i<5;i++)clouds.push({x:50+i*125+Math.random()*40,y:34+Math.random()*75,s:1+Math.random()*1.5});
}

function reset(){
obstacles=[];
particles=[];
score=0;
speed=BASE_SPEED;
spawn=100;
playing=true;
last=0;
dino={x:55,y:329,w:28,h:36,vy:0,onGround:true,step:0};
seedClouds();
overlay.classList.add('hidden');
updateUI();
}

function jump(){
if(!playing){reset();return}
if(dino.onGround){dino.vy=-12;dino.onGround=false;burst(dino.x+12,ground,8)}
}

function burst(px,py,count){
for(let i=0;i<count;i++)particles.push({x:px,y:py,vx:-1-Math.random()*2,vy:-Math.random()*2,life:1,size:1+Math.random()*2});
}

function addObstacle(){
const tall=Math.random()>.52;
obstacles.push({x:580,y:tall?316:331,w:tall?18:15,h:tall?49:34,arms:Math.random()>.5});
}

function hit(a,b){
return a.x+9<b.x+b.w&&a.x+a.w-8>b.x&&a.y+8<b.y+b.h&&a.y+a.h-5>b.y;
}

function gameOver(){
playing=false;
best=Math.max(best,Math.floor(score));
try{localStorage.setItem('takeshi_dino_best',String(best))}catch(e){}
gameTitle.textContent='GAME OVER';
gameSub.textContent='SCORE '+pad(score)+' • TOQUE PARA TENTAR DE NOVO';
start.textContent='JOGAR NOVAMENTE';
overlay.classList.remove('hidden');
updateUI();
}

function update(dt){
speed=Math.min(8.5,BASE_SPEED+score/280);
score+=.13*speed*dt;
spawn-=speed*dt;
if(spawn<=0){addObstacle();spawn=260+Math.random()*160-speed*4}

dino.vy+=.66*dt;
dino.y+=dino.vy*dt;
if(dino.y>=ground-dino.h){dino.y=ground-dino.h;dino.vy=0;dino.onGround=true}
dino.step+=speed*.13*dt;

for(let i=obstacles.length-1;i>=0;i--){
obstacles[i].x-=speed*dt;
if(hit(dino,obstacles[i])){gameOver();return}
if(obstacles[i].x+obstacles[i].w<0)obstacles.splice(i,1);
}

for(let i=0;i<clouds.length;i++){
clouds[i].x-=.18*speed*dt;
if(clouds[i].x<-45){clouds[i].x=590;clouds[i].y=30+Math.random()*80}
}

for(let i=particles.length-1;i>=0;i--){
const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=.04*dt;
if(p.life<=0)particles.splice(i,1);
}
updateUI();
}

function drawCloud(cloud){
x.fillStyle='rgba(151,168,177,.38)';
x.fillRect(cloud.x,cloud.y+6,28*cloud.s,4*cloud.s);
x.beginPath();x.arc(cloud.x+8*cloud.s,cloud.y+6*cloud.s,7*cloud.s,Math.PI,0);x.arc(cloud.x+18*cloud.s,cloud.y+6*cloud.s,9*cloud.s,Math.PI,0);x.fill();
}

function drawDino(){
const px=Math.floor(dino.x),py=Math.floor(dino.y+(dino.onGround&&playing?Math.sin(dino.step)*1.2:0));
x.fillStyle=playing?'#bcc7cc':'#875f61';
x.fillRect(px+3,py+9,16,20);
x.fillRect(px+14,py,16,15);
x.fillRect(px+25,py+10,7,5);
x.fillRect(px,py+15,7,6);
x.fillStyle='#26343a';x.fillRect(px+24,py+4,2,2);
x.fillStyle=playing?'#bcc7cc':'#875f61';
if(!dino.onGround){x.fillRect(px+7,py+27,5,9);x.fillRect(px+16,py+27,5,9)}else if(Math.floor(dino.step)%2){x.fillRect(px+5,py+27,5,9);x.fillRect(px+17,py+27,5,6)}else{x.fillRect(px+8,py+27,5,6);x.fillRect(px+15,py+27,5,9)}
}

function drawCactus(o){
x.fillStyle='#a75c5e';x.fillRect(o.x,o.y,o.w,o.h);x.fillRect(o.x-5,o.y+12,7,6);x.fillRect(o.x-5,o.y+6,4,12);
if(o.arms){x.fillRect(o.x+o.w-2,o.y+21,7,6);x.fillRect(o.x+o.w+2,o.y+13,4,14)}
}

function draw(){
x.clearRect(0,0,560,420);
const bg=x.createLinearGradient(0,0,0,420);bg.addColorStop(0,'#202c32');bg.addColorStop(1,'#152027');x.fillStyle=bg;x.fillRect(0,0,560,420);
clouds.forEach(drawCloud);
x.strokeStyle='rgba(168,184,192,.55)';x.setLineDash([7,6]);x.beginPath();x.moveTo(0,ground+.5);x.lineTo(560,ground+.5);x.stroke();x.setLineDash([]);
x.fillStyle='rgba(113,132,141,.26)';for(let i=0;i<14;i++)x.fillRect(i*43+(score%43),ground+12+(i%3)*4,15,2);
obstacles.forEach(drawCactus);
drawDino();
particles.forEach(function(p){x.globalAlpha=Math.max(0,p.life);x.fillStyle='#9bacb4';x.fillRect(p.x,p.y,p.size,p.size)});x.globalAlpha=1;
}

function loop(t){
if(!last)last=t;
const dt=Math.min((t-last)/16.67,2);
last=t;
if(playing)update(dt);
draw();
requestAnimationFrame(loop);
}

board.addEventListener('pointerdown',function(e){if(e.target===start)return;e.preventDefault();jump()});
start.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();reset()});
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});

seedClouds();
updateUI();
requestAnimationFrame(loop);
</script>
</body><a class="voltar" href="../">← Catálogo</a></html>
