<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eclipse</title><style>html{background:#0f171c;min-height:100%}body{min-height:100vh}.voltar{position:fixed;left:10px;bottom:10px;z-index:99999;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:12px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)}</style></head><!DOCTYPE html>

	<p id="txtScore">SCORE: 0</p>

	<canvas></canvas>
	
	<script>class Sprite{
	constructor(x,y,radius,color){
		this.x = x
		this.y = y
		this.radius = radius
		this.color = color
	}
	
	draw(){
		ctx.beginPath()
		ctx.arc(this.x,this.y,this.radius,0,Math.PI*2,false)
		ctx.fillStyle = this.color
		ctx.fill()
	}
}

class Projectile extends Sprite{
	constructor(x,y,radius,color,velocity){
		super(x,y,radius,color)
		this.velocity = velocity
	}
	
	update(){
		this.draw()
		this.x += this.velocity.x
		this.y += this.velocity.y
	}
}

class Sphere extends Sprite{
	constructor(x,y,radius,color,angleUpdateValue,player){
		super(x,y,radius,color)
		this.angleUpdateValue = angleUpdateValue
		this.player = player
		this.angle = 0
	}
	
	update(){
		this.draw()
		this.angle += this.angleUpdateValue
		if(Math.abs(this.angle) >= Math.PI*2){
			this.angle = 0
		}
		this.x = this.player.x + Math.cos(this.angle) * this.player.radius
		this.y = this.player.y + Math.sin(this.angle) * this.player.radius
	}
}

class Player extends Sprite{
	constructor(x,y,radius,color){
		super(x,y,radius,color)
		this.coreRadius = radius/6
		this.s1 = new Sphere(
								this.x + Math.cos(0) * this.radius,
								this.y + Math.sin(0) * this.radius,
								2,
								'#48FCFF',
								.08,
								this
							)
		this.s2 = new Sphere(
								this.x + Math.cos(0) * this.radius,
								this.y + Math.sin(0) * this.radius,
								2,
								'#48FCFF',
								-.08,
								this
							)
	}
	
	draw(){
		ctx.beginPath()
		ctx.arc(this.x,this.y,this.coreRadius,0,Math.PI*2,false)
		ctx.strokeStyle = this.color
		ctx.stroke()
	}
	
	update(){
		this.draw()
		this.s1.update()
		this.s2.update()
	}
}

class Enemy extends Projectile{
	constructor(x,y,radius,color,velocity){
		super(x,y,radius,color,velocity)
		this.newRadius = radius
	}
	
	draw(){
		ctx.beginPath()
		ctx.arc(this.x,this.y,this.radius,0,Math.PI*2,false)
		ctx.strokeStyle = this.color
		ctx.stroke()
	}
	
	shrink(){
		if(this.newRadius < this.radius){
			this.radius -= .5
		}
	}
	
	update(){
		this.shrink()
		this.draw()
		this.x += this.velocity.x
		this.y += this.velocity.y
	}
}

class Particle extends Projectile{
	constructor(x,y,radius,color,velocity){
		super(x,y,radius,color,velocity)
		this.alpha = 1
	}
	
	draw(){
		ctx.save()
		ctx.globalAlpha = this.alpha
		ctx.beginPath()
		ctx.arc(this.x,this.y,this.radius,0,Math.PI*2,false)
		ctx.fillStyle = this.color
		ctx.fill()
		ctx.restore()
	}
	
	update(){
		this.draw()
		this.alpha -= .01
		this.x += this.velocity.x
		this.y += this.velocity.y
		this.velocity.x *= .99
		this.velocity.y *= .99
	}
}

const $ = (tag) => document.querySelector(tag)

const cnv = $('canvas')
	cnv.width = document.documentElement.clientWidth || innerWidth || 360
	cnv.height = document.documentElement.clientHeight || innerHeight || 640
const ctx = cnv.getContext('2d')
const player = new Player(cnv.width/2,cnv.height/2,30,'#48FCFF')
const shootingSpeed = 4
const txtScore = $('#txtScore')
const gameOverModal = $('#gameOverModal')
const gameOverScore = $('#gameOverScore')
const btnNewGame = $('#btnNewGame')
const startModal = $('#startModal')
const startContainer = $('#startContainer')
const musicGame = {volume: 0, currentTime: 0, play(){}, pause(){}}
	musicGame.volume = .5
const EXPLOSION = 1
const SHOOTING = 2

let projectiles = []
let enemies = []
let particles = []
let intervalID
let animationID
let score = 0

function spawnEnemies(){
	intervalID = setInterval(()=>{
		const radius = Math.floor(Math.random() * 26) + 5
		
		let posX, posY
		if(Math.random() < .5){
			posX = Math.random() < .5 ? 0 - radius : cnv.width + radius
			posY = Math.random() * cnv.height
		} else {
			posX = Math.random() * cnv.width
			posY = Math.random() < .5 ? 0 - radius : cnv.height + radius
		}
		
		const angle = Math.atan2(player.y - posY, player.x - posX)
		const velocity = {
			x: Math.cos(angle),
			y: Math.sin(angle)
		}
		
		const color = 'hsl('+ Math.random() * 360 +',50%,50%)'
		
		enemies.push(new Enemy(posX,posY,radius,color,velocity))
	},1500)
}

cnv.addEventListener('click',(e)=>{
	e.preventDefault()
	playSound(SHOOTING)
	const angle = Math.atan2(e.clientY - player.y, e.clientX - player.x)
	const velocity = {
		x: Math.cos(angle) * shootingSpeed,
		y: Math.sin(angle) * shootingSpeed
	}
	projectiles.push(new Projectile(player.x, player.y, 3, '#48FCFF', velocity))
})

startContainer.addEventListener('click',()=>{
	startModal.style.opacity = 0
	
	setTimeout(()=>{
		startModal.style.zIndex = -1
	},500)
	
	newGame()
})

btnNewGame.addEventListener('click', newGame)

function loop(){
	animationID = requestAnimationFrame(loop,cnv)
	update()
}

function update(){
	ctx.fillStyle = 'rgba(0,0,0,.1)'
	ctx.fillRect(0,0,cnv.width,cnv.height)
	
	checkEnemies()
	checkProjectiles()
	checkParticles()
	player.update()
}

function checkEnemies(){
	enemies.forEach((enemy)=>{
		enemy.update()
		
		const distance = Math.hypot(player.x - enemy.x, player.y - enemy.y)
		if(distance < player.radius + enemy.radius){
			gameOver()
		}
	})
}

function gameOver(){
	musicGame.pause()
	musicGame.currentTime = 0
	cancelAnimationFrame(animationID)
	clearInterval(intervalID)
	gameOverScore.innerText = score
	gameOverModal.style.opacity = 1
	gameOverModal.style.zIndex = 1
}

function newGame(){
	musicGame.play()
	gameOverModal.style.opacity = 0
	gameOverModal.style.zIndex = -1
	projectiles = []
	particles = []
	enemies = []
	score = 0
	txtScore.innerText = 'SCORE: ' + score
	loop()
	spawnEnemies()
	ctx.fillStyle = 'white'
	ctx.fillRect(0,0,cnv.width,cnv.height)
}

	sound.addEventListener('canplaythrough',()=>{
		sound.play()
	})

function checkProjectiles(){
	for(let i = projectiles.length -1; i >= 0; i--){
		const p = projectiles[i]
		p.update()
		checkOffScreen(p,i)
		
		for(let eIndex = enemies.length -1; eIndex >= 0; eIndex--){
			const enemy = enemies[eIndex]
			const distance = Math.hypot(p.x - enemy.x, p.y - enemy.y)
			
			//Colisão do projétil com o inimigo
			if(distance < p.radius + enemy.radius){
				playSound(EXPLOSION)
				if(enemy.radius > 15){
					enemy.newRadius = enemy.radius -10
				} else {
					enemies.splice(eIndex,1)
				}
				
				score += 50 - Math.floor(enemy.radius)
				txtScore.innerText = 'SCORE: ' + score
				
				projectiles.splice(i,1)
				createParticles(enemy,p)
			}
		}
	}
}

function checkOffScreen(projectile, index){
	if(	projectile.x + projectile.radius < 0 ||
		projectile.x - projectile.radius > cnv.width ||
		projectile.y + projectile.radius < 0 || 
		projectile.y - projectile.radius > cnv.height)
	{
		score -= 100
		if(score < 0){
			score = 0
		}
		
		txtScore.innerText = 'SCORE: ' + score
	
		projectiles.splice(index,1)
	}
}

function createParticles(enemy,projectile){
	for(let i = 0; i < enemy.radius * 2; i++){
		const velocity = {
			x: (Math.random() - .5) * (Math.random() * 6),
			y: (Math.random() - .5) * (Math.random() * 6)
		}
		particles.push(new Particle(projectile.x,projectile.y,Math.random()*2,enemy.color,velocity))
	}
}

function checkParticles(){
	for(let i = particles.length -1; i >= 0; i--){
		const p = particles[i]
		p.update()
		if(p.alpha <= 0){
			particles.splice(i,1)
		}
	}
}
