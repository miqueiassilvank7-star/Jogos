<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jogos MSNK7BOT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f171c;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:12px;max-width:1000px;margin:auto}
.tile{position:relative;aspect-ratio:1;border:0;border-radius:18px;overflow:hidden;padding:0;cursor:pointer;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tile:active{transform:scale(.96)}
.emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;padding-bottom:18px}
.nm{position:absolute;left:0;right:0;bottom:0;padding:8px 6px;font-size:12px;font-weight:800;letter-spacing:.4px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#player{position:fixed;inset:0;z-index:50;background:#0f171c;display:none}
#player.on{display:block}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:60;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:#fff;font-size:20px}
</style></head><body>
<div class="grid">
<button class="tile" data-g="bomberman" aria-label="BOMBERMAN" style="background:linear-gradient(145deg,hsl(347,70%,45%),hsl(37,70%,22%))"><span class="emo">💣</span><span class="nm">BOMBERMAN</span><img src="capas/bomberman.png" alt="" loading="lazy" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='capas/bomberman.jpg'}else{this.remove()}"></button>
<button class="tile" data-g="bounce" aria-label="Bounce" style="background:linear-gradient(145deg,hsl(336,70%,45%),hsl(26,70%,22%))"><span class="emo">⚽</span><span class="nm">Bounce</span><img src="capas/bounce.png" alt="" loading="lazy" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='capas/bounce.jpg'}else{this.remove()}"></button>

<button class="tile" data-g="tiroaoalvo" aria-label="Tiroaoalvo" style="background:linear-gradient(145deg,hsl(188,70%,45%),hsl(238,70%,22%))"><span class="emo">🎯</span><span class="nm">Tiroaoalvo</span><img src="capas/tiroaoalvo.png" alt="" loading="lazy" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='capas/tiroaoalvo.jpg'}else{this.remove()}"></button>
<button class="tile" data-g="xadrez" aria-label="Xadrez" style="background:linear-gradient(145deg,hsl(204,70%,45%),hsl(254,70%,22%))"><span class="emo">♟️</span><span class="nm">Xadrez</span><img src="capas/xadrez.png" alt="" loading="lazy" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='capas/xadrez.jpg'}else{this.remove()}"></button>
</div>
<div id="player"><button id="x" aria-label="Fechar">✕</button><iframe id="f" allow="fullscreen; autoplay"></iframe></div>
<script>
var P=document.getElementById("player"),F=document.getElementById("f");
function openGame(s){F.src=s+"/";P.classList.add("on");history.pushState({g:s},"")}
function closeGame(){P.classList.remove("on");F.src="about:blank"}
document.querySelectorAll(".tile").forEach(function(t){t.addEventListener("click",function(){openGame(t.dataset.g)})});
document.getElementById("x").addEventListener("click",function(){if(history.state&&history.state.g)history.back();else closeGame()});
window.addEventListener("popstate",closeGame);
</script></body></html>
