<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEON PONG</title><style>html{background:#0f171c;min-height:100%}body{min-height:100vh}.voltar{position:fixed;left:10px;bottom:10px;z-index:99999;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:12px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)}</style></head><style>

:root{
  --accent-a:#8b6cf0;
  --accent-b:#4fa8e0;
  --ink:#f2f5f7;
  --ink-dim:rgba(242,245,247,.55);
  --ink-faint:rgba(242,245,247,.4);
}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{width:100%;max-width:620px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,rgba(34,45,53,.97),rgba(24,33,40,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.head{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--accent-b);opacity:.85}
.title{font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.value{font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;font-variant-numeric:tabular-nums}
.label{font-size:8px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-bottom:3px}
.main{padding:16px}
.board{position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),rgba(0,0,0,0) 60%),rgba(4,9,12,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;margin-top:12px;justify-content:center}
.button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;background:rgba(255,255,255,.06);padding:0 16px;transition:transform .08s ease,filter .08s ease}
.button:active{transform:scale(.94);filter:brightness(1.15)}
.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(139,108,240,.35)}
.status{text-align:center;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);letter-spacing:.3px;margin-top:12px;min-height:12px}
.overlay{position:absolute;inset:0;background:rgba(10,15,19,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;animation:fade-in .18s ease}
.overlay.hidden{display:none}
.overlay-title{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#fff,var(--accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.2px;margin-top:8px;max-width:280px}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

.move{min-width:72px;font-size:18px}
</style><body><div class="wrap"><div class="card"><div class="head"><div><div class="brand">MSNK7BOT</div><div class="title">NEON PONG</div></div><div class="stats"><div><div class="label">VOC&Ecirc;</div><div class="value" id="player">00</div></div><div><div class="label">CPU</div><div class="value" id="cpu">00</div></div></div></div>
<div class="main"><div class="board" id="board"><canvas id="game" width="560" height="420"></canvas><div class="overlay" id="overlay"><div class="overlay-title" id="overTitle">NEON PONG</div><div class="overlay-sub" id="overSub">PRIMEIRO A 5 VENCE</div><button class="button primary" id="start" style="margin-top:15px">COME&Ccedil;AR</button></div></div><div class="controls"><button class="button move" data-move="up">&#9650;</button><button class="button move" data-move="down">&#9660;</button></div><div class="status">ARRASTE OU MOVA SUA RAQUETE</div></div></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),boardEl=document.getElementById('board'),overlay=document.getElementById('overlay'),playerEl=document.getElementById('player'),cpuEl=document.getElementById('cpu');let playerY=180,cpuY=180,ball,ps=0,cs=0,playing=false,last=0,move=0;
function ui(){playerEl.textContent=String(ps).padStart(2,'0');cpuEl.textContent=String(cs).padStart(2,'0')}function serve(dir){ball={x:280,y:210,vx:dir*4.1,vy:(Math.random()*4)-2}}
function reset(){playerY=180;cpuY=180;ps=0;cs=0;serve(Math.random()>.5?1:-1);playing=true;last=0;overlay.classList.add('hidden');ui()}
function finish(won){playing=false;document.getElementById('overTitle').textContent=won?'VOCÊ VENCEU':'CPU VENCEU';document.getElementById('overSub').textContent='PLACAR '+ps+' × '+cs;document.getElementById('start').textContent='JOGAR NOVAMENTE';overlay.classList.remove('hidden')}
function point(cpu){if(cpu)cs++;else ps++;ui();if(ps>=5||cs>=5)return finish(ps>=5);serve(cpu?-1:1)}
function update(dt){playerY=Math.max(0,Math.min(360,playerY+move*6*dt));cpuY+=Math.max(-3.25,Math.min(3.25,ball.y-(cpuY+30)))*dt;cpuY=Math.max(0,Math.min(360,cpuY));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y<7){ball.y=7;ball.vy=Math.abs(ball.vy)}if(ball.y>413){ball.y=413;ball.vy=-Math.abs(ball.vy)}if(ball.vx<0&&ball.x<31&&ball.x>18&&ball.y>playerY&&ball.y<playerY+60){ball.x=31;ball.vx=Math.abs(ball.vx)*1.035;ball.vy+=(ball.y-(playerY+30))*.075}if(ball.vx>0&&ball.x>529&&ball.x<542&&ball.y>cpuY&&ball.y<cpuY+60){ball.x=529;ball.vx=-Math.abs(ball.vx)*1.035;ball.vy+=(ball.y-(cpuY+30))*.075}if(ball.x<-12)point(true);if(ball.x>572)point(false)}
function draw(){x.fillStyle='#07131a';x.fillRect(0,0,560,420);x.setLineDash([8,10]);x.strokeStyle='rgba(255,255,255,.18)';x.beginPath();x.moveTo(280,0);x.lineTo(280,420);x.stroke();x.setLineDash([]);x.shadowBlur=12;x.shadowColor='#58d3ff';x.fillStyle='#e8f8ff';x.fillRect(18,playerY,10,60);x.shadowColor='#ff6ea8';x.fillRect(532,cpuY,10,60);x.shadowColor='#ffd166';x.beginPath();x.arc(ball.x,ball.y,7,0,Math.PI*2);x.fill();x.shadowBlur=0}
function loop(t){if(!last)last=t;const dt=Math.min((t-last)/16.67,2);last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}
function pointY(e){const rect=c.getBoundingClientRect();return(e.clientY-rect.top)*420/rect.height}boardEl.addEventListener('pointermove',e=>{if(playing)playerY=Math.max(0,Math.min(360,pointY(e)-30))});document.querySelectorAll('[data-move]').forEach(b=>{const dir=b.dataset.move==='up'?-1:1;b.addEventListener('pointerdown',e=>{e.preventDefault();move=dir});b.addEventListener('pointerup',()=>move=0);b.addEventListener('pointercancel',()=>move=0)});document.addEventListener('pointerup',()=>move=0);document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reset()});serve(1);ui();requestAnimationFrame(loop);
</script></body><a class="voltar" href="../">← Catálogo</a></html>
