<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pac-Man</title><style>html{background:#0f171c;min-height:100%}body{min-height:100vh}.voltar{position:fixed;left:10px;bottom:10px;z-index:99999;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:12px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)}</style></head>
<style>

:root{
  --accent-a:#8b6cf0;
  --accent-b:#4fa8e0;
  --ink:#f2f5f7;
  --ink-dim:rgba(242,245,247,.55);
  --ink-faint:rgba(242,245,247,.4);
}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{width:100%;max-width:620px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,rgba(34,45,53,.97),rgba(24,33,40,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.head{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--accent-b);opacity:.85}
.title{font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.value{font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;font-variant-numeric:tabular-nums}
.label{font-size:8px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-bottom:3px}
.main{padding:16px}
.board{position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),rgba(0,0,0,0) 60%),rgba(4,9,12,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;margin-top:12px;justify-content:center}
.button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;background:rgba(255,255,255,.06);padding:0 16px;transition:transform .08s ease,filter .08s ease}
.button:active{transform:scale(.94);filter:brightness(1.15)}
.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(139,108,240,.35)}
.status{text-align:center;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);letter-spacing:.3px;margin-top:12px;min-height:12px}
.overlay{position:absolute;inset:0;background:rgba(10,15,19,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;animation:fade-in .18s ease}
.overlay.hidden{display:none}
.overlay-title{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#fff,var(--accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.2px;margin-top:8px;max-width:280px}
@keyframes fade-in{from{opacity:0}to{opacity:1}}


body{
  overflow:hidden;
}

.pac-wrap{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:10px;
}

.pac-card{
  background:#05070d;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.5);
}

.pac-head{
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.25);
}

.pac-title{
  font-size:18px;
  font-weight:900;
  color:#ffe600;
  letter-spacing:1px;
}

.pac-sub{
  font-size:8px;
  color:#777;
  letter-spacing:2px;
  margin-top:2px;
}

.pac-stats{
  display:flex;
  gap:12px;
}

.pac-stat{
  text-align:center;
}

.pac-label{
  display:block;
  font-size:7px;
  color:#777;
  letter-spacing:1px;
}

.pac-value{
  font:800 15px monospace;
  color:white;
}

.lives{
  color:#ff4055;
  letter-spacing:1px;
  font-size:13px;
}

.game-box{
  padding:10px;
  background:#000;
}

.canvas-wrap{
  width:100%;
  background:#000;
  border:2px solid #101b70;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  box-shadow:0 0 20px rgba(20,40,255,.15);
}

#pacmanCanvas{
  display:block;
  width:100%;
  height:auto;
  background:#000;
}

.game-message{
  text-align:center;
  min-height:18px;
  padding:8px 4px 2px;
  color:#777;
  font:10px monospace;
}

.pac-controls{
  padding:12px 18px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  background:#05070d;
}

.ctrl-row{
  display:flex;
  gap:7px;
}

.ctrl{
  width:58px;
  height:48px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.13);
  background:linear-gradient(145deg,#171b25,#090b10);
  color:white;
  font-size:22px;
  font-weight:900;
  display:flex;
  justify-content:center;
  align-items:center;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:pointer;
}

.ctrl:active{
  transform:scale(.91);
  background:#222838;
}

.bottom-buttons{
  display:flex;
  gap:8px;
  padding:0 18px 16px;
  background:#05070d;
}

.pac-btn{
  flex:1;
  min-height:42px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  background:#11151e;
  color:white;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.pac-btn:active{
  transform:scale(.95);
}

.pac-btn.start{
  background:linear-gradient(135deg,#3026b9,#155ed1);
}

@media(max-width:380px){
  .ctrl{
    width:52px;
    height:44px;
  }
}

.pause-overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.62);
  z-index:10;
  pointer-events:none;
}

.pause-overlay.show{
  display:flex;
}

.pause-title{
  color:#fff;
  font:bold 28px Arial,sans-serif;
  text-shadow:0 2px 8px #000;
}

.pause-sub{
  color:#aaa;
  font:11px monospace;
  margin-top:8px;
}

.gameover-overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.72);
  z-index:11;
  pointer-events:none;
}

.gameover-overlay.show{
  display:flex;
}

.gameover-title{
  color:#ff4055;
  font:bold 26px Arial,sans-serif;
}

.gameover-score{
  color:#fff;
  font:13px monospace;
  margin-top:8px;
}
</style>

<div class="pac-wrap">
  <div class="pac-card">

    <div class="pac-head">

      <div>
        <div class="pac-title">PAC-MAN</div>
        <div class="pac-sub">HTML ARCADE</div>
      </div>

      <div class="pac-stats">

        <div class="pac-stat">
          <span class="pac-label">SCORE</span>
          <span class="pac-value" id="score">0</span>
        </div>

        <div class="pac-stat">
          <span class="pac-label">LEVEL</span>
          <span class="pac-value" id="level">1</span>
        </div>

        <div class="pac-stat">
          <span class="pac-label">LIVES</span>
          <span class="pac-value lives" id="lives">♥♥♥</span>
        </div>

      </div>

    </div>

    <div class="game-box">

      <div class="canvas-wrap">

        <canvas
          id="pacmanCanvas"
          width="540"
          height="390"
        ></canvas>

        <div class="pause-overlay" id="pauseOverlay">
          <div class="pause-title">PAUSADO</div>
          <div class="pause-sub">Toque em PAUSAR para continuar</div>
        </div>

        <div class="gameover-overlay" id="gameOverOverlay">
          <div class="gameover-title">GAME OVER</div>
          <div class="gameover-score" id="gameOverScore"></div>
        </div>

      </div>

      <div class="game-message" id="message">
        Toque em INICIAR para jogar
      </div>

    </div>

    <div class="pac-controls">

      <div class="ctrl-row">
        <button class="ctrl" id="up" type="button">▲</button>
      </div>

      <div class="ctrl-row">
        <button class="ctrl" id="left" type="button">◀</button>
        <button class="ctrl" id="down" type="button">▼</button>
        <button class="ctrl" id="right" type="button">▶</button>
      </div>

    </div>

    <div class="bottom-buttons">

      <button
        class="pac-btn start"
        id="start"
        type="button"
      >
        INICIAR
      </button>

      <button
        class="pac-btn"
        id="pause"
        type="button"
      >
        PAUSAR
      </button>

      <button
        class="pac-btn"
        id="restart"
        type="button"
      >
        REINICIAR
      </button>

    </div>

  </div>
</div>

function playAudio(audio){

  if(!audio || !audio.src){
    return;
  }

  try{

    audio.currentTime = 0;

    const promise = audio.play();

    if(promise && promise.catch){
      promise.catch(() => {});
    }

  }catch(error){}

}


function stopAudio(audio){

  if(!audio){
    return;
  }

  try{

    audio.pause();
    audio.currentTime = 0;

  }catch(error){}

}

/* ============================================================
   MAPA
   ============================================================ */

function buildMap(){

  map = MAP_TEMPLATE.map(row => {

    return row
      .split("")
      .map(tile => tile === " " ? "." : tile);

  });

}


/* ============================================================
   PAREDES
   ============================================================ */

function isWall(x,y){

  if(
    x < 0 ||
    x >= COLS ||
    y < 0 ||
    y >= ROWS
  ){
    return true;
  }

  return map[y][x] === "#";

}


function isWalkable(x,y){

  return !isWall(x,y);

}


/* ============================================================
   CENTRO DO TILE
   ============================================================ */

function tileCenterX(x){
  return x * TILE + TILE / 2;
}


function tileCenterY(y){
  return y * TILE + TILE / 2;
}


/* ============================================================
   DISTÂNCIA ATÉ O CENTRO
   ============================================================ */

function distanceToCenter(entity){

  const cx = tileCenterX(entity.x);
  const cy = tileCenterY(entity.y);

  return Math.sqrt(
    (entity.px - cx) * (entity.px - cx) +
    (entity.py - cy) * (entity.py - cy)
  );

}


/* ============================================================
   ESTÁ NO CENTRO?
   ============================================================ */

function isAtCenter(entity){

  const cx = tileCenterX(entity.x);
  const cy = tileCenterY(entity.y);

  return (
    Math.abs(entity.px - cx) < 0.5 &&
    Math.abs(entity.py - cy) < 0.5
  );

}


/* ============================================================
   RESET POSIÇÕES
   ============================================================ */

function resetPositions(){

  /*
   * PAC-MAN
   */

  pacman.x = 9;
  pacman.y = 9;

  pacman.px = tileCenterX(9);
  pacman.py = tileCenterY(9);

  pacman.direction = DIRS.none;
  pacman.nextDirection = DIRS.none;


  /*
   * FANTASMAS
   *
   * Todos em tiles realmente caminháveis.
   */

  const positions = [

    {
      x:8,
      y:5,
      dir:DIRS.left
    },

    {
      x:9,
      y:5,
      dir:DIRS.right
    },

    {
      x:8,
      y:7,
      dir:DIRS.down
    },

    {
      x:9,
      y:7,
      dir:DIRS.down
    }

  ];


  ghosts.forEach((g,index) => {

    const position = positions[index];

    g.x = position.x;
    g.y = position.y;

    g.px = tileCenterX(g.x);
    g.py = tileCenterY(g.y);

    g.dir = position.dir;

    g.frightened = false;

  });


  powerTimer = 0;

}


/* ============================================================
   RESET COMPLETO
   ============================================================ */

function resetGame(){

  score = 0;
  level = 1;
  lives = 3;

  running = false;
  paused = false;
  gameOver = false;

  powerTimer = 0;
  wakaTimer = 0;

  buildMap();
  resetPositions();

  pauseOverlay.classList.remove("show");
  gameOverOverlay.classList.remove("show");

  message.textContent =
    "Toque em INICIAR para jogar";

  updateUI();
  draw();

}


/* ============================================================
   UI
   ============================================================ */

function updateUI(){

  scoreEl.textContent = score;

  levelEl.textContent = level;

  livesEl.textContent =
    "♥".repeat(Math.max(0,lives));

}


/* ============================================================
   DIREÇÃO
   ============================================================ */

function setDirection(direction){

  if(gameOver){
    return;
  }

  pacman.nextDirection = direction;

  if(!running){
    startGame();
  }

}


/* ============================================================
   VERIFICA MOVIMENTO
   ============================================================ */

function canMoveFrom(x,y,dir){

  if(!dir || dir === DIRS.none){
    return false;
  }

  const nx = x + dir.x;
  const ny = y + dir.y;

  return isWalkable(nx,ny);

}


/* ============================================================
   MOVIMENTO DO PAC-MAN
   ============================================================

   CORREÇÃO PRINCIPAL:

   O personagem agora anda de CENTRO para CENTRO.

   Não usamos mais Math.round() para descobrir em qual
   tile o Pac-Man está durante o movimento.

   Isso elimina o problema de trocar de tile no meio
   do caminho e consultar uma parede incorreta.
   ============================================================ */

function movePacman(dt){

  let remaining = dt;

  /*
   * Proteção contra loop infinito.
   */

  let safety = 0;


  while(
    remaining > 0 &&
    safety < 4
  ){

    safety++;


    /*
     * Garante que estamos exatamente no centro.
     */

    if(isAtCenter(pacman)){

      pacman.px = tileCenterX(pacman.x);
      pacman.py = tileCenterY(pacman.y);


      /*
       * Primeiro tenta a direção pressionada.
       */

      if(
        canMoveFrom(
          pacman.x,
          pacman.y,
          pacman.nextDirection
        )
      ){

        pacman.direction =
          pacman.nextDirection;

      }


      /*
       * Se não pode continuar na direção atual,
       * fica parado.
       */

      if(
        !canMoveFrom(
          pacman.x,
          pacman.y,
          pacman.direction
        )
      ){

        pacman.direction = DIRS.none;

      }


      /*
       * Come a bolinha exatamente no centro.
       */

      eatTile();

    }


    if(pacman.direction === DIRS.none){
      break;
    }


    /*
     * Tile de destino.
     */

    const targetX =
      pacman.x +
      pacman.direction.x;

    const targetY =
      pacman.y +
      pacman.direction.y;


    /*
     * Segurança adicional.
     */

    if(!isWalkable(targetX,targetY)){

      pacman.direction = DIRS.none;

      break;

    }


    const targetPX =
      tileCenterX(targetX);

    const targetPY =
      tileCenterY(targetY);


    const dx =
      targetPX - pacman.px;

    const dy =
      targetPY - pacman.py;


    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if(distance <= 0.001){

      pacman.x = targetX;
      pacman.y = targetY;

      pacman.px = targetPX;
      pacman.py = targetPY;

      continue;

    }


    const amount =
      pacman.speed *
      remaining /
      1000;


    /*
     * Ainda não chegou no próximo centro.
     */

    if(amount < distance){

      pacman.px +=
        pacman.direction.x *
        amount;

      pacman.py +=
        pacman.direction.y *
        amount;

      remaining = 0;

    }


    /*
     * Chegou no centro do próximo tile.
     */

    else{

      pacman.px = targetPX;
      pacman.py = targetPY;

      pacman.x = targetX;
      pacman.y = targetY;


      const usedTime =
        distance /
        pacman.speed *
        1000;


      remaining =
        Math.max(
          0,
          remaining - usedTime
        );


      /*
       * Comer imediatamente ao chegar.
       */

      eatTile();

    }

  }


  /*
   * Animação da boca.
   */

  pacman.mouth +=
    pacman.mouthDir *
    dt *
    0.012;


  if(
    pacman.mouth > 1 ||
    pacman.mouth < 0
  ){

    pacman.mouthDir *= -1;

  }


  /*
   * Som waka.
   */

  wakaTimer -= dt;

  if(
    wakaTimer <= 0 &&
    pacman.direction !== DIRS.none
  ){

    playAudio(audioWaka);

    wakaTimer = 180;

  }

}


/* ============================================================
   COMER
   ============================================================ */

function eatTile(){

  const x = pacman.x;
  const y = pacman.y;

  if(
    !map[y] ||
    map[y][x] === undefined
  ){
    return;
  }


  if(map[y][x] === "."){

    map[y][x] = " ";

    score += 10;

    updateUI();

  }


  if(map[y][x] === "o"){

    map[y][x] = " ";

    score += 50;

    powerTimer = 7000;

    playAudio(audioPower);


    ghosts.forEach(g => {

      g.frightened = true;

    });


    updateUI();

  }


  checkLevelComplete();

}


/* ============================================================
   NÍVEL
   ============================================================ */

function checkLevelComplete(){

  let remaining = 0;


  for(let y = 0; y < ROWS; y++){

    for(let x = 0; x < COLS; x++){

      if(
        map[y][x] === "." ||
        map[y][x] === "o"
      ){

        remaining++;

      }

    }

  }


  if(remaining === 0){

    level++;

    message.textContent =
      "Nível " + level + "!";


    buildMap();
    resetPositions();

    updateUI();

  }

}


/* ============================================================
   OPÇÕES DOS FANTASMAS
   ============================================================ */

function getGhostOptions(g){

  const options = [];


  const directions = [

    DIRS.up,
    DIRS.left,
    DIRS.down,
    DIRS.right

  ];


  for(const dir of directions){

    /*
     * Não volta imediatamente.
     */

    if(
      dir.x === -g.dir.x &&
      dir.y === -g.dir.y
    ){

      continue;

    }


    const nx =
      g.x + dir.x;

    const ny =
      g.y + dir.y;


    if(isWalkable(nx,ny)){

      options.push(dir);

    }

  }


  /*
   * Se ficou sem saída, permite voltar.

   */

  if(options.length === 0){

    for(const dir of directions){

      const nx =
        g.x + dir.x;

      const ny =
        g.y + dir.y;


      if(isWalkable(nx,ny)){

        options.push(dir);

      }

    }

  }


  return options;

}


/* ============================================================
   ESCOLHE DIREÇÃO DO FANTASMA
   ============================================================ */

function chooseGhostDirection(g){

  const options =
    getGhostOptions(g);


  if(options.length === 0){

    g.dir = DIRS.none;

    return;

  }


  /*
   * Assustado = aleatório.
   */

  if(g.frightened){

    g.dir =
      options[
        Math.floor(
          Math.random() *
          options.length
        )
      ];

    return;

  }


  /*
   * Persegue Pac-Man.
   */

  let best = options[0];

  let bestDistance = Infinity;


  for(const dir of options){

    const nx =
      g.x + dir.x;

    const ny =
      g.y + dir.y;


    const dx =
      nx - pacman.x;

    const dy =
      ny - pacman.y;


    const distance =
      dx * dx +
      dy * dy;


    if(distance < bestDistance){

      bestDistance = distance;
      best = dir;

    }

  }


  if(Math.random() < 0.12){

    g.dir =
      options[
        Math.floor(
          Math.random() *
          options.length
        )
      ];

  }else{

    g.dir = best;

  }

}


/* ============================================================
   MOVIMENTO DOS FANTASMAS
   ============================================================ */

function moveGhost(g,dt){

  let remaining = dt;

  let safety = 0;


  while(
    remaining > 0 &&
    safety < 4
  ){

    safety++;


    /*
     * No centro escolhe direção.
     */

    if(isAtCenter(g)){

      g.px = tileCenterX(g.x);
      g.py = tileCenterY(g.y);

      chooseGhostDirection(g);

    }


    if(g.dir === DIRS.none){
      break;
    }


    const targetX =
      g.x + g.dir.x;

    const targetY =
      g.y + g.dir.y;


    /*
     * Não deixa fantasma entrar em parede.
     */

    if(!isWalkable(targetX,targetY)){

      /*
       * Recalcula uma direção válida.

       */

      chooseGhostDirection(g);

      /*
       * Se ainda não tiver caminho, para.

       */

      if(g.dir === DIRS.none){
        break;
      }

      continue;

    }


    const targetPX =
      tileCenterX(targetX);

    const targetPY =
      tileCenterY(targetY);


    const dx =
      targetPX - g.px;

    const dy =
      targetPY - g.py;


    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if(distance <= 0.001){

      g.x = targetX;
      g.y = targetY;

      g.px = targetPX;
      g.py = targetPY;

      continue;

    }


    const speed =
      g.speed +
      Math.min(
        (level - 1) * 3,
        18
      );


    const amount =
      speed *
      remaining /
      1000;


    /*
     * Ainda não chegou ao centro.

     */

    if(amount < distance){

      g.px +=
        g.dir.x *
        amount;

      g.py +=
        g.dir.y *
        amount;

      remaining = 0;

    }


    /*
     * Chegou ao próximo tile.

     */

    else{

      g.px = targetPX;
      g.py = targetPY;

      g.x = targetX;
      g.y = targetY;


      const usedTime =
        distance /
        speed *
        1000;


      remaining =
        Math.max(
          0,
          remaining - usedTime
        );

    }

  }

}


/* ============================================================
   COLISÃO
   ============================================================ */

function checkGhostCollision(){

  for(const g of ghosts){

    const dx =
      pacman.px - g.px;

    const dy =
      pacman.py - g.py;


    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    if(distance < 18){

      /*
       * Fantasma assustado.
       */

      if(g.frightened){

        score += 200;

        playAudio(audioEatGhost);


        /*
         * Volta para a casa segura.
         */

        g.x = 8;
        g.y = 5;

        g.px = tileCenterX(g.x);
        g.py = tileCenterY(g.y);

        g.dir = DIRS.left;

        g.frightened = false;


        updateUI();

        continue;

      }


      /*
       * Pac-Man morreu.
       */

      loseLife();

      return;

    }

  }

}


/* ============================================================
   PERDE VIDA
   ============================================================ */

function loseLife(){

  if(!running || gameOver){
    return;
  }


  lives--;

  updateUI();


  playAudio(audioDie);


  running = false;


  if(lives <= 0){

    gameOver = true;

    pauseOverlay.classList.remove("show");

    gameOverOverlay.classList.add("show");


    gameOverScore.textContent =
      "Pontuação: " + score;


    message.textContent =
      "Fim de jogo! Toque em REINICIAR.";


    stopAudio(audioTheme);

    return;

  }


  message.textContent =
    "Você perdeu uma vida!";


  resetPositions();


  setTimeout(() => {

    if(!gameOver){

      startGame();

    }

  },1200);

}


/* ============================================================
   UPDATE
   ============================================================ */

function update(dt){

  if(
    !running ||
    paused ||
    gameOver
  ){

    return;

  }


  movePacman(dt);


  ghosts.forEach(g => {

    moveGhost(g,dt);

  });


  if(powerTimer > 0){

    powerTimer -= dt;


    if(powerTimer <= 0){

      powerTimer = 0;


      ghosts.forEach(g => {

        g.frightened = false;

      });

    }

  }


  checkGhostCollision();

}


/* ============================================================
   LABIRINTO
   ============================================================ */

function drawMaze(){

  ctx.fillStyle = "#000";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  for(let y = 0; y < ROWS; y++){

    for(let x = 0; x < COLS; x++){

      const tile =
        map[y][x];


      /*
       * PAREDE
       */

      if(tile === "#"){

        ctx.fillStyle = "#101cc4";

        ctx.fillRect(

          x * TILE + 3,
          y * TILE + 3,

          TILE - 6,
          TILE - 6

        );


        ctx.strokeStyle = "#263cff";

        ctx.lineWidth = 1;


        ctx.strokeRect(

          x * TILE + 5,
          y * TILE + 5,

          TILE - 10,
          TILE - 10

        );

      }


      /*
       * BOLINHA
       */

      else if(tile === "."){

        ctx.fillStyle = "#fff";

        ctx.beginPath();

        ctx.arc(

          x * TILE + TILE / 2,
          y * TILE + TILE / 2,

          2.5,

          0,
          Math.PI * 2

        );

        ctx.fill();

      }


      /*
       * POWER PILL
       */

      else if(tile === "o"){

        const pulse =
          6 +
          Math.sin(Date.now() / 130) * 1.5;


        ctx.fillStyle = "#fff";

        ctx.beginPath();

        ctx.arc(

          x * TILE + TILE / 2,
          y * TILE + TILE / 2,

          pulse,

          0,
          Math.PI * 2

        );

        ctx.fill();

      }

    }

  }

}


/* ============================================================
   PAC-MAN
   ============================================================ */

function drawPacman(){

  const x = pacman.px;
  const y = pacman.py;


  let angle = 0;


  if(pacman.direction === DIRS.right){
    angle = 0;
  }

  if(pacman.direction === DIRS.down){
    angle = Math.PI / 2;
  }

  if(pacman.direction === DIRS.left){
    angle = Math.PI;
  }

  if(pacman.direction === DIRS.up){
    angle = -Math.PI / 2;
  }


  /*
   * Se estiver parado, mostra para onde
   * o jogador pediu para ir.
   */

  if(
    pacman.direction === DIRS.none &&
    pacman.nextDirection !== DIRS.none
  ){

    if(pacman.nextDirection === DIRS.right){
      angle = 0;
    }

    if(pacman.nextDirection === DIRS.down){
      angle = Math.PI / 2;
    }

    if(pacman.nextDirection === DIRS.left){
      angle = Math.PI;
    }

    if(pacman.nextDirection === DIRS.up){
      angle = -Math.PI / 2;
    }

  }


  const mouth =
    0.20 +
    pacman.mouth * 0.25;


  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(angle);

  ctx.fillStyle = "#ffe600";


  ctx.beginPath();

  ctx.moveTo(0,0);


  ctx.arc(

    0,
    0,

    12,

    mouth,
    Math.PI * 2 - mouth

  );


  ctx.closePath();

  ctx.fill();

  ctx.restore();

}


/* ============================================================
   FANTASMA
   ============================================================ */

function drawGhost(g){

  const x = g.px;
  const y = g.py;


  ctx.save();

  ctx.translate(x,y);


  let color = g.color;


  if(g.frightened){

    color =
      powerTimer < 2000 &&
      Math.floor(powerTimer / 200) % 2 === 0

        ? "#fff"

        : "#174bff";

  }


  ctx.fillStyle = color;


  /*
   * CABEÇA
   */

  ctx.beginPath();

  ctx.arc(

    0,
    -2,

    11,

    Math.PI,
    0

  );


  /*
   * CORPO
   */

  ctx.lineTo(11,11);

  ctx.lineTo(6,7);

  ctx.lineTo(2,11);

  ctx.lineTo(-2,7);

  ctx.lineTo(-6,11);

  ctx.lineTo(-11,7);

  ctx.closePath();

  ctx.fill();


  /*
   * OLHOS
   */

  if(!g.frightened){

    ctx.fillStyle = "#fff";

    ctx.beginPath();

    ctx.arc(
      -4,
      -3,
      3,
      0,
      Math.PI * 2
    );

    ctx.arc(
      4,
      -3,
      3,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
      -4,
      -3,
      1.5,
      0,
      Math.PI * 2
    );

    ctx.arc(
      4,
      -3,
      1.5,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* ============================================================
   DRAW
   ============================================================ */

function draw(){

  drawMaze();

  drawPacman();

  ghosts.forEach(drawGhost);

}


/* ============================================================
   LOOP
   ============================================================ */

function loop(timestamp){

  if(!lastTime){

    lastTime = timestamp;

  }


  const dt =
    Math.min(
      timestamp - lastTime,
      40
    );


  lastTime = timestamp;


  update(dt);

  draw();


  requestAnimationFrame(loop);

}


/* ============================================================
   INICIAR
   ============================================================ */

function startGame(){

  if(gameOver){
    return;
  }


  running = true;

  paused = false;


  pauseOverlay.classList.remove("show");


  message.textContent =
    "Coma todas as bolinhas!";


  lastTime =
    performance.now();


  playAudio(audioTheme);

}


/* ============================================================
   PAUSAR
   ============================================================ */

function togglePause(){

  if(
    gameOver ||
    !running
  ){

    return;

  }


  paused = !paused;


  if(paused){

    pauseOverlay.classList.add("show");

    message.textContent =
      "Jogo pausado";

  }else{

    pauseOverlay.classList.remove("show");

    message.textContent =
      "Continue!";


    lastTime =
      performance.now();

  }

}


/* ============================================================
   REINICIAR
   ============================================================ */

function restart(){

  stopAudio(audioTheme);
  stopAudio(audioWaka);

  resetGame();

  startGame();

}


/* ============================================================
   BOTÕES
   ============================================================ */

document
  .getElementById("start")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("pause")
  .addEventListener(
    "click",
    togglePause
  );


document
  .getElementById("restart")
  .addEventListener(
    "click",
    restart
  );


/* ============================================================
   CONTROLES TOUCH
   ============================================================ */

function setupControl(id,dir){

  const button =
    document.getElementById(id);


  if(!button){
    return;
  }


  button.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      setDirection(dir);

    },
    {
      passive:false
    }
  );


  button.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

    }
  );

}


setupControl(
  "up",
  DIRS.up
);

setupControl(
  "down",
  DIRS.down
);

setupControl(
  "left",
  DIRS.left
);

setupControl(
  "right",
  DIRS.right
);


/* ============================================================
   TECLADO
   ============================================================ */

document.addEventListener(
  "keydown",
  event => {

    const key =
      event.key.toLowerCase();


    if(
      event.key === "ArrowUp" ||
      key === "w"
    ){

      event.preventDefault();

      setDirection(DIRS.up);

      return;

    }


    if(
      event.key === "ArrowDown" ||
      key === "s"
    ){

      event.preventDefault();

      setDirection(DIRS.down);

      return;

    }


    if(
      event.key === "ArrowLeft" ||
      key === "a"
    ){

      event.preventDefault();

      setDirection(DIRS.left);

      return;

    }


    if(
      event.key === "ArrowRight" ||
      key === "d"
    ){

      event.preventDefault();

      setDirection(DIRS.right);

      return;

    }


    if(event.code === "Space"){

      event.preventDefault();

      togglePause();

    }

  }
);


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

buildMap();

resetPositions();

updateUI();

draw();

requestAnimationFrame(loop);

})();
