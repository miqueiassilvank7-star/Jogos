/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/

html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}
/* END OF CSS RESET */


/* FONTS */
h1, h2 {
    font-family: 'Fredoka One', cursive;
    font-weight: bold;
    color: black;
    text-align: center;
}
h1 {
	font-size: 3rem;
	padding: 2rem;
}
h2 {
	font-size: 1.5rem;
	margin-bottom: 0.5rem;
}

/* GENERAL */
body {
	background-color: rgb(250, 215, 220);
}

.container {
	background-color: white;
	border-bottom-left-radius: 2rem;
	border-bottom-right-radius: 2rem;
	border: 0.2rem solid black;
    box-shadow: 0 0 10px 10px pink;
    width: 90%;
	margin: 0 auto 5rem auto;
	padding: 0 1rem 2rem 1rem;
}

svg {
	display: block;
	margin: 0 auto;
}

/* path {
	fill: red !important;
} */

/* DROPDOWN */
.dropdown {
	position: relative;
	display: inline-block;
	width: 100%;
	margin-bottom: 4rem;
}

.dropdown-content {
	display: none;
	position: absolute;
	background-color: #f9f9f9;
	min-width: 90%;
	min-height: 100%;
	box-shadow: 0 0.5rem 0.2rem 0.2rem rgb(255, 192, 203, 0.4);
	border: 2px solid black;
	border-radius: 2rem;
	padding: 1rem;
	margin: auto;
	/* top: 0; bottom: 0;  */
	left: 0; 
	right: 0;
	z-index: 1;
}

.dropdown:hover .dropdown-content {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	grid-gap: 1.5rem;
}

.dropdown button {
	display: block;
	margin: 0 auto;
	padding: 0.5rem 2.5rem;
	border: 0.2rem solid black;
	border-radius: 2rem;
	background-color: lightpink;
	box-shadow: 0 0 0.2rem 0.2rem rgb(255, 192, 203, 0.4);
}

.dropdown button:hover, .dropdown button:active {
	background-color: white;
}

/* TINY IMAGES */
.tiny-images div {
	border: 5px solid black;
	border-radius: 2rem;
	background-color: pink;
	transition: transform .2s;
}

.tiny-images div:hover {
	transform: scale(1.05);
	background-color: white;
	box-shadow: 0 0.2rem 0.2rem 0.2rem rgb(255, 192, 203, 0.4);
}

/* COLOR PALETTE */
#palette {
	width: 100%;
	height: 8rem;
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	border: 0.1rem solid black;
	box-sizing: border-box;
}

#palette div {
	width: 100%;
	height: 100%;
	border: 0.1rem solid black;
	box-sizing: border-box;
}

#palette div:hover {
	box-shadow: inset 0 0 0 10px black;
}

#red {
	background-color: red;
}
#orange {
	background-color: orange;
}
#yellow {
	background-color: yellow;
}
#green {
	background-color: green;
}
#blue {
	background-color: blue;
}
#purple {
	background-color: purple;
}

.selected {
	box-shadow: inset 0 0 0 5px black;
}

/* MEDIA QUERIES */
@media (min-width: 650px) {
	svg {
		width: 70vw;
	}
}

@media (min-width: 900px) {
	main {
		display: grid;
		grid-template-columns: 30% 70%;
		grid-template-areas: "palette svg";
	}

	h2 {
		text-align: left;
		padding: 0 0.5rem;
	}

	.dropdown:hover .dropdown-content {
		grid-template-columns: repeat(4, 1fr);
		grid-gap: 1.5rem;
	}

	svg {
		grid-area: svg;
		width: 50vw;
	}

	#paletteBox {
		grid-area: palette;
		padding: 1rem;
	}

	#paletteBox h2 {
		text-align: center;
	}

	#palette {
		width: 25vw;
		height: 50vw;
		grid-template-columns: 1fr 1fr;
	}

}

@media (min-width: 1100px) {
	#palette {
		width: 20vw;
	}
}

    <script>// ////////////////////////
// GAME OBJECT
// ////////////////////////
const game = {
  selectedColor: 'white'
}

// GAME PROXY
const handler = {
  get (target, property) {
    return target[property]
  }
}
var proxyGame = new Proxy(game, handler)

// ////////////////////////
// INITIAL CURSOR
// ////////////////////////
document.body.style.cursor = `url('data:image/svg+xml;utf8,<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" height="32" width="32"><g id="Layer_1"><g id="Layer_1_1_"><g><path d="M14,4.9c4.9,0,8.9,4,8.9,8.9s-4,8.9-8.9,8.9s-8.9-4-8.9-8.9S9.1,4.9,14,4.9 M14,1.7C7.3,1.7,1.9,7.1,1.9,13.8S7.3,25.9,14,25.9s12.1-5.4,12.1-12.1S20.7,1.7,14,1.7L14,1.7z"/></g></g></g><g id="Layer_2"><circle stroke="black" fill="${proxyGame.selectedColor}" cx="14" cy="13.6" r="8.9"/></g></svg>'), auto`

// ////////////////////////
// COLOR PALETTE
// ////////////////////////
const $paletteColor = document.getElementsByClassName('paletteColor')

for (var i = 0; i < $paletteColor.length; i++) {
  $paletteColor[i].addEventListener('click', function () {
    for (var x = 0; x < $paletteColor.length; x++) {
      $paletteColor[x].classList.remove('selected')
    }
    this.classList.add('selected')
    proxyGame.selectedColor = this.id
    changeCursor()
  })
}

// ////////////////////////
// SELECT AN IMAGE
// ////////////////////////
const $tinyImages = document.querySelector('.tiny-images')

$tinyImages.closest('div').addEventListener('click', function (t) {
  for (var m = 0; m < $bigImages.length; m++) {
    $bigImages[m].style.display = 'none'
    for (var svgChild of $svg[m].childNodes) {
      for (var child of svgChild.childNodes) {
        if (child.nodeName == 'path' || child.nodeName == 'circle' || child.nodeName == 'rect' || child.nodeName == 'ellipse') {
          child.style.fill = 'white'
        }
      }
    }
  }
  if (t.target.dataset.tiny == 'puppy') {
    console.log('puppy')
    $bigImages[0].style.display = 'block'
  } else if (t.target.dataset.tiny == 'cakes') {
    console.log('cakes')
    $bigImages[1].style.display = 'block'
  } else if (t.target.dataset.tiny == 'dragon') {
    console.log('dragon')
    $bigImages[2].style.display = 'block'
  } else if (t.target.dataset.tiny == 'flowers') {
    console.log('flowers')
    $bigImages[3].style.display = 'block'
  }
})

// ////////////////////////
// BIG IMAGES
// ////////////////////////
const $bigImages = document.querySelectorAll('.big-images')

for (var b = 1; b < $bigImages.length; b++) {
  $bigImages[b].style.display = 'none'
}

// ////////////////////////
// SVG
// ////////////////////////
var $svg = document.querySelectorAll('svg')

for (var s = 0; s < $svg.length; s++) {
  $svg[s].addEventListener('click', function (c) {
    c.target.style.fill = game.selectedColor
  })
}

// ///////////////////////
// CUSTOM CURSOR
// ///////////////////////
function changeCursor () {
  var $paintbrush = `<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" height="32" width="32"><g id="Layer_1"><g id="Layer_1_1_"><g><path d="M14,4.9c4.9,0,8.9,4,8.9,8.9s-4,8.9-8.9,8.9s-8.9-4-8.9-8.9S9.1,4.9,14,4.9 M14,1.7C7.3,1.7,1.9,7.1,1.9,13.8S7.3,25.9,14,25.9s12.1-5.4,12.1-12.1S20.7,1.7,14,1.7L14,1.7z"/></g></g></g><g id="Layer_2"><circle stroke="black" fill="${proxyGame.selectedColor}" cx="14" cy="13.6" r="8.9"/></g></svg>`

  var $svgCursor = `url('data:image/svg+xml;utf8,${$paintbrush}'), auto`

  document.body.style.cursor = $svgCursor
}


document.querySelector('.dropdown > button').addEventListener('click',function(e){e.stopPropagation();this.parentNode.classList.toggle('open')});

(function(){
  var st = document.createElement('style');
  st.textContent = '#menuDesenhos{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#fff;overflow-y:auto;padding:16px;box-sizing:border-box;text-align:center;font-family:sans-serif}'
    + '#menuDesenhos h1{font-size:22px;margin:8px 0 16px}'
    + '#menuDesenhos .grade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}'
    + '#menuDesenhos .card{border:2px solid #ddd;border-radius:12px;padding:8px;background:#fff;cursor:pointer}'
    + '#menuDesenhos .card img{width:100%;height:auto;max-height:140px;object-fit:contain;pointer-events:none}'
    + '#menuDesenhos .card span{display:block;margin-top:4px;font-size:14px}'
    + '#btnVoltar{position:fixed;top:6px;left:6px;z-index:9000;padding:6px 12px;border:1px solid #999;border-radius:8px;background:#fff;font-size:14px}'
    + 'body:not(.jogando) #btnVoltar{display:none}'
    + 'body.jogando #menuDesenhos{display:none}'
    + 'body.jogando{padding-top:44px}'
    + 'body.jogando .dropdown,body.jogando h1,body.jogando header,body.jogando footer,body.jogando #paletteBox h2{display:none!important}';
  document.head.appendChild(st);

  var nomes = {puppy:'Cachorrinho',cakes:'Bolos',dragon:'Dragão',flowers:'Flores',coracao:'Coração',estrela:'Estrela',peixe:'Peixe',casa:'Casa',borboleta:'Borboleta',sol:'Sol'};
  var menu = document.createElement('div');
  menu.id = 'menuDesenhos';
  menu.innerHTML = '<h1>🎨 Escolha um desenho</h1><div class="grade"></div>';
  var grade = menu.querySelector('.grade');

  document.querySelectorAll('.tiny-images img').forEach(function(orig){
    var id = orig.getAttribute('data-tiny') || '';
    var card = document.createElement('div');
    card.className = 'card';
    var im = document.createElement('img');
    im.src = orig.src;
    var sp = document.createElement('span');
    sp.textContent = nomes[id] || id;
    card.appendChild(im);
    card.appendChild(sp);
    card.addEventListener('click', function(){
      orig.click();
      document.body.classList.add('jogando');
      window.scrollTo(0, 0);
    });
    grade.appendChild(card);
  });

  var btn = document.createElement('button');
  btn.id = 'btnVoltar';
  btn.textContent = '☰ Desenhos';
  btn.addEventListener('click', function(){
    document.body.classList.remove('jogando');
  });

  document.body.appendChild(menu);
  document.body.appendChild(btn);
})();
