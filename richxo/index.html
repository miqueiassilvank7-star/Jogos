<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOGO DA VELHA</title><style>html{background:#0f171c;min-height:100%}body{min-height:100vh}.voltar{position:fixed;left:10px;bottom:10px;z-index:99999;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:12px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)}</style></head><style>

:root{
  --accent-a:#8b6cf0;
  --accent-b:#4fa8e0;
  --ink:#f2f5f7;
  --ink-dim:rgba(242,245,247,.55);
  --ink-faint:rgba(242,245,247,.4);
}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{width:100%;max-width:620px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,rgba(34,45,53,.97),rgba(24,33,40,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.head{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--accent-b);opacity:.85}
.title{font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.value{font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;font-variant-numeric:tabular-nums}
.label{font-size:8px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-bottom:3px}
.main{padding:16px}
.board{position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),rgba(0,0,0,0) 60%),rgba(4,9,12,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;margin-top:12px;justify-content:center}
.button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;background:rgba(255,255,255,.06);padding:0 16px;transition:transform .08s ease,filter .08s ease}
.button:active{transform:scale(.94);filter:brightness(1.15)}
.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(139,108,240,.35)}
.status{text-align:center;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);letter-spacing:.3px;margin-top:12px;min-height:12px}
.overlay{position:absolute;inset:0;background:rgba(10,15,19,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;animation:fade-in .18s ease}
.overlay.hidden{display:none}
.overlay-title{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#fff,var(--accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.2px;margin-top:8px;max-width:280px}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

.modes{display:flex;gap:7px;margin-bottom:10px}.modes .button{flex:1}.active{background:#00a884;color:#071713;border-color:#00c69b}.xo-grid{display:grid;grid-template-columns:repeat(3,1fr);background:#10191e}.cell{aspect-ratio:1;border:0;background:transparent;color:#edf2f4;font:bold 52px Arial;border-right:1px solid #34434b;border-bottom:1px solid #34434b}.cell:nth-child(3n){border-right:0}.cell:nth-last-child(-n+3){border-bottom:0}.cell.o{color:#00c99a}.cell.win{background:rgba(0,168,132,.18)}
</style><body><div class="wrap"><div class="card"><div class="head"><div><div class="brand">MSNK7BOT</div><div class="title">JOGO DA VELHA</div></div><div class="stats"><div><div class="label">X</div><div class="value" id="sx">0</div></div><div><div class="label">EMPATES</div><div class="value" id="sd">0</div></div><div><div class="label">O</div><div class="value" id="so">0</div></div></div></div>
<div class="main"><div class="modes"><button class="button active" id="ai">CONTRA IA</button><button class="button" id="pvp">2 JOGADORES</button></div><div class="board"><div class="xo-grid" id="grid"></div><div class="overlay hidden" id="overlay"><div class="overlay-title" id="result">VIT&Oacute;RIA</div><div class="overlay-sub">TOQUE EM NOVA RODADA</div></div></div><div class="controls"><button class="button primary" id="reset">NOVA RODADA</button></div><div class="status" id="status">SUA VEZ &bull; JOGUE COM X</div></div></div></div>
<script>
const grid=document.getElementById('grid'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay'),resultEl=document.getElementById('result');let board=Array(9).fill(''),turn='X',mode='ai',over=false,scores={X:0,O:0,D:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(b){for(const line of wins)if(b[line[0]]&&b[line[0]]===b[line[1]]&&b[line[0]]===b[line[2]])return {who:b[line[0]],line};return b.every(Boolean)?{who:'D',line:[]}:null}
function render(win=[]){grid.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v==='O'?' o':'')+(win.includes(i)?' win':'');b.textContent=v;b.disabled=!!v||over;b.addEventListener('pointerdown',e=>{e.preventDefault();play(i)});grid.appendChild(b)});document.getElementById('sx').textContent=scores.X;document.getElementById('so').textContent=scores.O;document.getElementById('sd').textContent=scores.D}
function finish(r){over=true;scores[r.who]++;render(r.line);resultEl.textContent=r.who==='D'?'EMPATE':r.who+' VENCEU';overlay.classList.remove('hidden');statusEl.textContent=resultEl.textContent}
function play(i){if(over||board[i])return;board[i]=turn;let r=winner(board);if(r)return finish(r);turn=turn==='X'?'O':'X';render();statusEl.textContent='VEZ DE '+turn;if(mode==='ai'&&turn==='O')setTimeout(aiMove,280)}
function aiMove(){if(over)return;let pick=null;for(const who of ['O','X'])for(const line of wins){const vals=line.map(i=>board[i]);if(vals.filter(v=>v===who).length===2&&vals.includes('')){pick=line[vals.indexOf('')];break}if(pick!==null)break}if(pick===null&&board[4]==='')pick=4;if(pick===null){const empty=board.map((v,i)=>v===''?i:-1).filter(i=>i>=0);pick=empty[Math.floor(Math.random()*empty.length)]}play(pick)}
function reset(){board=Array(9).fill('');turn='X';over=false;overlay.classList.add('hidden');statusEl.textContent=mode==='ai'?'SUA VEZ • JOGUE COM X':'VEZ DO JOGADOR X';render()}
function setMode(next){mode=next;document.getElementById('ai').classList.toggle('active',mode==='ai');document.getElementById('pvp').classList.toggle('active',mode==='pvp');reset()}
document.getElementById('ai').addEventListener('pointerdown',()=>setMode('ai'));document.getElementById('pvp').addEventListener('pointerdown',()=>setMode('pvp'));document.getElementById('reset').addEventListener('pointerdown',reset);reset();
</script></body><a class="voltar" href="../" target="_top">← Catálogo</a><script>if(window.top!==window.self){var v=document.querySelector(".voltar");if(v)v.style.display="none"}</script></html>
