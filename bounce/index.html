html,
body {
  width: 100%;
  min-width: 100%;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: #07151c;
}

.wrap {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
}

.head {
  width: 100% !important;

.main {
  width: 100% !important;

/* =========================
   ÁREA DO JOGO
   ========================= */

#bounce {
  position: relative;
  width: 100%;
  height: min(78vh, 720px);
  min-height: 500px;
  overflow: hidden;

  border-radius: 24px;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(55, 130, 155, 0.25),
      transparent 55%
    ),
    #164052;

  box-shadow:
    inset 0 0 60px rgba(0, 0, 0, 0.3),
    0 15px 40px rgba(0, 0, 0, 0.35);

  user-select: none;
  touch-action: none;
}

/* =========================
   FUNDO
   ========================= */

#bounce::before {
  content: "";

  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(255,255,255,.08) 0 2px,
      transparent 3px
    ),
    radial-gradient(
      circle at 80% 30%,
      rgba(255,255,255,.06) 0 2px,
      transparent 3px
    ),
    radial-gradient(
      circle at 50% 70%,
      rgba(255,255,255,.05) 0 2px,
      transparent 3px
    );

  background-size:
    130px 130px,
    170px 170px,
    210px 210px;

  pointer-events: none;
}

/* =========================
   HUD
   ========================= */

#hud {
  position: absolute;

  z-index: 30;

  left: 0;
  right: 0;
  top: 0;

  display: flex;

  justify-content: space-between;
  align-items: center;

  padding: 14px 18px;

  font-size: 19px;
  font-weight: 900;

  background:
    rgba(4, 18, 24, 0.45);

  backdrop-filter: blur(8px);
}

.hud-left,
.hud-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* =========================
   MUNDO
   ========================= */

#world {
  position: absolute;

  left: 0;
  top: 0;

  width: 3000px;
  height: 100%;

  transform-origin: 0 0;
}

/* =========================
   PLATAFORMAS
   ========================= */

.platform {
  position: absolute;

  background:
    linear-gradient(
      #66402a,
      #392116
    );

  border-top:
    7px solid #76a93b;

  border-radius:
    5px 5px 2px 2px;

  box-shadow:
    inset 0 -8px 0 rgba(0,0,0,.18),
    0 7px 0 rgba(0,0,0,.20);
}

/* =========================
   PLAYER
   ========================= */

#player {
  position: absolute;

  width: 46px;
  height: 46px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 32% 25%,
      #ffffff 0 4%,
      #ffaaaa 5% 16%,
      #ff4545 35%,
      #f0003d 75%,
      #a8002d 100%
    );

  box-shadow:
    inset -7px -8px 12px rgba(80,0,30,.30),
    inset 7px 6px 12px rgba(255,255,255,.40),
    0 8px 15px rgba(0,0,0,.35);

  z-index: 15;
}

/* =========================
   MOEDAS
   ========================= */

.coin {
  position: absolute;

  width: 27px;
  height: 27px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff6a0,
      #ffd22e 35%,
      #d89400 80%
    );

  border:
    2px solid #f7b900;

  color: #9b6100;

  font-size: 13px;
  font-weight: 900;

  box-shadow:
    0 0 12px rgba(255,204,40,.45);

  z-index: 10;

  animation:
    coinFloat 1s ease-in-out infinite;
}

.coin.collected {
  display: none;
}

@keyframes coinFloat {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }

}

/* =========================
   META
   ========================= */

.goal {
  position: absolute;

  width: 42px;
  height: 85px;

  border-left:
    5px solid #eeeeee;

  z-index: 8;
}

.goal::before {
  content: "🏁";

  position: absolute;

  left: -2px;
  top: -20px;

  font-size: 36px;
}

/* =========================
   MENU DE FASES
   ========================= */

#phaseMenu {
  position: absolute;

  z-index: 50;

  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      rgba(38,96,115,.96),
      rgba(8,28,36,.99)
    );

  text-align: center;
}

.menu-ball {
  font-size: 72px;

  filter:
    drop-shadow(
      0 12px 15px
      rgba(0,0,0,.35)
    );

  animation:
    bounceBall 1.5s ease-in-out infinite;
}

@keyframes bounceBall {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-18px);
  }

}

#phaseMenu h1 {
  margin: 4px 0;

  font-size:
    clamp(42px, 9vw, 76px);

  line-height: 1;

  font-weight: 900;

  color: #ffffff;
}

.menu-subtitle {
  margin-bottom: 28px;

  font-size: 20px;
  font-weight: 800;

  opacity: .80;
}

.phase-list {
  display: grid;

  grid-template-columns:
    repeat(5, minmax(55px, 1fr));

  gap: 10px;

  width:
    min(95%, 650px);

.phase-btn {
  border: 0;

  min-height: 62px;

  border-radius: 14px;

  background:
    rgba(255,255,255,.10);

  color: #ffffff;

  font-size: 22px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    inset 0 0 0 1px
    rgba(255,255,255,.10);

  transition:
    transform .15s,
    background .15s;
}

.phase-btn:active {
  transform: scale(.94);
}

.phase-btn:hover {
  background:
    rgba(255,255,255,.20);
}

.phase-btn.selected {
  background:
    rgba(255,255,255,.25);

  box-shadow:
    0 0 0 2px
    rgba(255,255,255,.65),
    0 8px 20px
    rgba(0,0,0,.25);
}

.phase-btn small {
  display: block;

  margin-top: 3px;

  font-size: 9px;

  opacity: .65;
}

/* =========================
   CONTROLES
   ========================= */

#controls {
  position: absolute;

  z-index: 40;

  left: 0;
  right: 0;
  bottom: 15px;

  display: flex;

  justify-content: center;

  gap: 18px;

  pointer-events: auto;
}

.game-control {
  width: 62px;
  height: 52px;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius: 12px;

  background:
    rgba(255,255,255,.90);

  color: #111111;

  font-size: 24px;

  font-weight: 900;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.25);

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;
}

.game-control:active {
  transform:
    translateY(3px);
}

/* =========================
   MENSAGEM
   ========================= */

#message {
  position: absolute;

  z-index: 60;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    rgba(0,0,0,.65);

  backdrop-filter: blur(5px);
}

.message-box {
  width:
    min(88%, 440px);

  padding: 30px;

  border-radius: 24px;

  background:
    #173d4c;

  text-align: center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.5);
}

.message-box h2 {
  margin:
    0 0 10px;

  font-size: 36px;
}

.message-box p {
  margin:
    8px 0 22px;

  font-size: 18px;

  opacity: .80;
}

.restart {
  border: 0;

  padding:
    14px 25px;

  border-radius: 12px;

  background:
    #ffffff;

  color:
    #173d4c;

  font-size: 17px;

  font-weight: 900;

  cursor: pointer;
}

/* =========================
   CELULAR
   ========================= */

@media (max-width: 600px) {

  #bounce {
    height: 76vh;
    min-height: 500px;
    border-radius: 18px;
  }

  #hud {
    font-size: 16px;
    padding: 11px 13px;
  }

  .hud-left,
  .hud-right {
    gap: 8px;
  }

  .phase-list {
    grid-template-columns:
      repeat(3, 1fr);

    width: 88%;
  }

  .phase-btn {
    min-height: 58px;
  }

  .menu-ball {
    font-size: 62px;
  }

  #phaseMenu h1 {
    font-size: 50px;
  }

}

          "1";

        element.style.left =
          data[0] + "px";

        element.style.top =
          data[1] + "px";

        world.appendChild(
          element
        );

        coins.push({

          x: data[0],
          y: data[1],

          collected: false,

          element

        });

      }
    );


    goal =
      document.createElement(
        "div"
      );

    goal.className =
      "goal";

    goal.style.left =
      level.goal + "px";

    goal.style.top =
      "365px";

    world.appendChild(
      goal
    );

  }


  /* =========================
     RESET PLAYER
     ========================= */

  function resetPlayer() {

    physics.x =
      level.spawn.x;

    physics.y =
      level.spawn.y;

    physics.vx =
      0;

    physics.vy =
      0;

    physics.grounded =
      false;

  }


  /* =========================
     HUD
     ========================= */

  function updateHUD() {

    coinCount.textContent =
      collected;

    coinTotal.textContent =
      level.coins.length;

    lifeCount.textContent =
      lives;

    phaseHud.textContent =
      "FASE " +
      (currentLevel + 1);

    headerPhase.textContent =
      currentLevel + 1;

  }


  /* =========================
     PULO
     ========================= */

  function jump() {

    if (!playing) {
      return;
    }

    if (!physics.grounded) {
      return;
    }

    physics.vy =
      physics.jumpPower;

    physics.grounded =
      false;

  }


  /* =========================
     TECLADO
     ========================= */

  window.addEventListener(
    "keydown",
    (event) => {

      const key =
        event.key.toLowerCase();


      if (
        key === "arrowleft" ||
        key === "a"
      ) {

        keys.left = true;

        event.preventDefault();

      }


      if (
        key === "arrowright" ||
        key === "d"
      ) {

        keys.right = true;

        event.preventDefault();

      }


      if (
        key === "arrowup" ||
        key === "w" ||
        key === " "
      ) {

        if (!event.repeat) {
          jump();
        }

        event.preventDefault();

      }

    }
  );


  window.addEventListener(
    "keyup",
    (event) => {

      const key =
        event.key.toLowerCase();


      if (
        key === "arrowleft" ||
        key === "a"
      ) {

        keys.left = false;

      }


      if (
        key === "arrowright" ||
        key === "d"
      ) {

        keys.right = false;

      }

    }
  );


  /* =========================
     CONTROLES TOUCH
     ========================= */

  function holdButton(
    element,
    property
  ) {

    const down =
      (event) => {

        event.preventDefault();

        keys[property] =
          true;

      };


    const up =
      (event) => {

        event.preventDefault();

        keys[property] =
          false;

      };


    element.addEventListener(
      "pointerdown",
      down
    );

    element.addEventListener(
      "pointerup",
      up
    );

    element.addEventListener(
      "pointercancel",
      up
    );

    element.addEventListener(
      "pointerleave",
      up
    );

  }


  holdButton(
    document.getElementById("left"),
    "left"
  );


  holdButton(
    document.getElementById("right"),
    "right"
  );


  document
    .getElementById("jump")
    .addEventListener(
      "pointerdown",
      (event) => {

        event.preventDefault();

        jump();

      }
    );


  /* =========================
     COLISÃO
     ========================= */

  function intersects(
    ax,
    ay,
    aw,
    ah,
    bx,
    by,
    bw,
    bh
  ) {

    return (
      ax < bx + bw &&
      ax + aw > bx &&
      ay < by + bh &&
      ay + ah > by
    );

  }


  /* =========================
     FÍSICA
     ========================= */

  function updatePhysics(dt) {

    const oldX =
      physics.x;

    const oldY =
      physics.y;


    if (keys.left) {

      physics.vx -=
        physics.acceleration * dt;

    }


    if (keys.right) {

      physics.vx +=
        physics.acceleration * dt;

    }


    if (
      !keys.left &&
      !keys.right
    ) {

      physics.vx *=
        Math.pow(0.80, dt);

    }


    physics.vx =
      Math.max(
        -physics.maxSpeed,
        Math.min(
          physics.maxSpeed,
          physics.vx
        )
      );


    physics.x +=
      physics.vx * dt;


    physics.vy +=
      physics.gravity * dt;

    physics.y +=
      physics.vy * dt;


    physics.grounded =
      false;


    for (
      const platform
      of platforms
    ) {

      const hit =
        intersects(
          physics.x,
          physics.y,
          physics.width,
          physics.height,

          platform.x,
          platform.y,
          platform.w,
          platform.h
        );


      if (!hit) {
        continue;
      }


      if (
        oldY +
          physics.height
          <=
          platform.y + 10 &&
        physics.vy >= 0
      ) {

        physics.y =
          platform.y -
          physics.height;

        physics.vy = 0;

        physics.grounded =
          true;

        continue;

      }


      if (
        oldY >=
          platform.y +
          platform.h -
          5 &&
        physics.vy < 0
      ) {

        physics.y =
          platform.y +
          platform.h;

        physics.vy =
          0;

        continue;

      }


      if (
        oldX +
          physics.width
          <=
          platform.x
      ) {

        physics.x =
          platform.x -
          physics.width;

        physics.vx =
          0;

        continue;

      }


      if (
        oldX >=
          platform.x +
          platform.w
      ) {

        physics.x =
          platform.x +
          platform.w;

        physics.vx =
          0;

      }

    }


    if (physics.x < 0) {

      physics.x = 0;

      physics.vx = 0;

    }


    if (physics.y > 620) {

      loseLife();

    }

  }


  /* =========================
     MOEDAS
     ========================= */

  function checkCoins() {

    for (
      const coin
      of coins
    ) {

      if (coin.collected) {
        continue;
      }


      const hit =
        intersects(
          physics.x,
          physics.y,
          physics.width,
          physics.height,

          coin.x,
          coin.y,
          27,
          27
        );


      if (hit) {

        coin.collected =
          true;

        coin.element.classList.add(
          "collected"
        );

        collected++;

        updateHUD();

      }

    }

  }


  /* =========================
     META
     ========================= */

  function checkGoal() {

    if (!goal) {
      return;
    }


    if (
      physics.x +
        physics.width >=
      level.goal
    ) {

      winLevel();

    }

  }


  /* =========================
     PERDER VIDA
     ========================= */

  function loseLife() {

    if (!playing) {
      return;
    }


    lives--;

    updateHUD();


    if (lives <= 0) {

      gameOver();

      return;

    }


    resetPlayer();

  }


  /* =========================
     GAME OVER
     ========================= */

  function gameOver() {

    playing =
      false;

    messageTitle.textContent =
      "💔 FIM DE JOGO";

    messageText.textContent =
      "Você perdeu todas as vidas.";

    message.style.display =
      "flex";

  }


  /* =========================
     VITÓRIA
     ========================= */

  function winLevel() {

    if (finishedLevel) {
      return;
    }

    finishedLevel =
      true;

    playing =
      false;


    if (
      currentLevel <
      levels.length - 1
    ) {

      messageTitle.textContent =
        "🏆 FASE CONCLUÍDA!";

      messageText.textContent =
        "Moedas: " +
        collected +
        "/" +
        level.coins.length +
        ". Próxima fase liberada.";

    } else {

      messageTitle.textContent =
        "🎉 PARABÉNS!";

      messageText.textContent =
        "Você terminou todas as fases do Bounce!";

    }


    message.style.display =
      "flex";

  }


  /* =========================
     REINICIAR
     ========================= */

  restart.addEventListener(
    "click",
    () => {

      if (
        finishedLevel &&
        currentLevel <
        levels.length - 1
      ) {

        currentLevel++;

      }

      startLevel();

    }
  );


  /* =========================
     CÂMERA
     ========================= */

  function updateCamera() {

    const screenWidth =
      game.clientWidth;


    const target =
      physics.x -
      screenWidth * 0.38;


    cameraX +=
      (
        target -
        cameraX
      ) * 0.08;


    const maxCamera =
      Math.max(
        0,
        level.width -
        screenWidth
      );


    cameraX =
      Math.max(
        0,
        Math.min(
          maxCamera,
          cameraX
        )
      );


    world.style.transform =
      "translateX(" +
      (-cameraX) +
      "px)";

  }


  /* =========================
     RENDER
     ========================= */

  function render() {

    player.style.left =
      physics.x + "px";

    player.style.top =
      physics.y + "px";

    updateCamera();

  }


  /* =========================
     LOOP
     ========================= */

  function loop(timestamp) {

    if (!playing) {
      return;
    }


    let dt =
      (
        timestamp -
        lastTime
      ) / 16.666;


    lastTime =
      timestamp;


    dt =
      Math.min(
        dt,
        2
      );


    updatePhysics(dt);

    checkCoins();

    checkGoal();

    render();


    animation =
      requestAnimationFrame(
        loop
      );

  }


  /* =========================
     INICIALIZAÇÃO
     ========================= */

  createPhaseMenu();

})();

</script>
