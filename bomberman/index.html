<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOMBERMAN</title><style>html{background:#0f171c;min-height:100%}body{min-height:100vh}.voltar{position:fixed;left:10px;bottom:10px;z-index:99999;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:12px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)}</style></head><style>
:root{
  --accent-a:#8b6cf0;
  --accent-b:#4fa8e0;
  --ink:#f2f5f7;
  --ink-dim:rgba(242,245,247,.55);
  --ink-faint:rgba(242,245,247,.4);
}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{width:100%;max-width:620px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,rgba(34,45,53,.97),rgba(24,33,40,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.head{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--accent-b);opacity:.85}
.title{font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.value{font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;font-variant-numeric:tabular-nums}
.label{font-size:8px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-bottom:3px}
.main{padding:16px}
.board{position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),rgba(0,0,0,0) 60%),rgba(4,9,12,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;margin-top:12px;justify-content:center}
.button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;background:rgba(255,255,255,.06);padding:0 16px;transition:transform .08s ease,filter .08s ease}
.button:active{transform:scale(.94);filter:brightness(1.15)}
.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(139,108,240,.35)}
.status{text-align:center;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);letter-spacing:.3px;margin-top:12px;min-height:12px}
.overlay{position:absolute;inset:0;background:rgba(10,15,19,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;animation:fade-in .18s ease}
.overlay.hidden{display:none}
.overlay-title{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#fff,var(--accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.2px;margin-top:8px;max-width:280px}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
html, body {
    margin: 0;
}

#defs-only {
    display: none;
}

#playground {
    margin: 0;
    width: 80%;
    height: 90%;
    position: absolute;
    top: 5%;
    left: 10%;
}

.pUse {
    transform-origin: 19px 19px;
    -webkit-transform-origin: 19px 19px;
    -moz-transform-origin: 19px 19px;
}

text {
    font-family: "Courier New", monospace;
}

#musicText {
    white-space: pre; 
}

progress {
    width: 56%;
    height: 3%;
    top: 55%;
    left: 22%;
    position: absolute;
    z-index: 101;
    -webkit-appearance: progress-bar;
    box-sizing: border-box;
    display: inline-block;
    color: saddlebrown;
    background-color: brown;

}

.help {
    margin: 5px;
    position: absolute;
    bottom: -220px;
}

.controls {
    border-collapse: collapse;
}

th, td {
    border: 1px solid black;
    padding: 10px;
}

th {
    border-bottom: 3px solid black;
}



html,body{margin:0}
.board{aspect-ratio:1/1;position:relative}
#playground{position:absolute;top:0;left:0;width:100%;height:100%;margin:0;display:block}
.svgstore{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.help{display:none}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:none;padding:4px}
.main{padding:4px}
.head{display:none}
.card{border-radius:12px}
.tpads{touch-action:none;margin-top:8px}
.tpads{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px}
.dpad .button{padding:0;min-height:50px;font-size:18px;touch-action:none}
.dpad .u{grid-column:2;grid-row:1}
.dpad .l{grid-column:1;grid-row:2}
.dpad .d{grid-column:2;grid-row:2}
.dpad .r{grid-column:3;grid-row:2}
.bombBtn{width:96px;height:96px;border-radius:50%;font-size:30px;padding:0;touch-action:none}
</style>

<script>/**
 * Created by Peter on 22.01.2016.
 */

//---- CONSTANTS ----
const DIRECTION_UP = [87, 38, 73, 104];
const DIRECTION_DOWN = [83, 40, 75, 101];
const DIRECTION_LEFT = [65, 37, 74, 100];
const DIRECTION_RIGHT = [68, 39, 76, 102];
const PLACE_BOMB = [16, 13, 32, 96];

const fps = 60;
const bombDelay = 150;
const explosionTime = 40;


const musicFiles = [
    "Dash Cancel - Nutritious.mp3",
    "Falcon Punch - Benjamin Briggs.mp3",
    "Together, We Fly - Neblix.mp3",
    "Charge! Towards the Sunset of Intergalactic Dictatorship - HeavenWraith.mp3"
];

//--- GAME VARIABLES

var nrOfPlayers = 4;

var prcBoxes = 0.55; // how many percent of the game will be filled with boxes

//powerup spawn probabilities for each broken box (should be <= 1 in total)
var prcSpeed = 0.07;
var prcBombAm = 0.07;
var prcBombPow = 0.07;
var prcRandom = 0.2;


function playerObj() { // player definition
    return {
        x: 1,
        y: 1,
        id: "",
        column: 1,
        line: 1,
        curSpeedX: 0,
        curSpeedY: 0,
        maxSpeed: 1, // will be recalculated onload
        bombCount: 1,
        bombPower: 2,
        placingBombs: false,
        forcePlacingBombs: false,
        walkingDirectionMult: 1, // 1 == forward, -1 == backwards
        alive: false,
        score: 0,
        gamepad: null
    }
}

var p1 = playerObj();
p1.id = "p1";
var p2 = playerObj();
p2.id = "p2";
var p3 = playerObj();
p3.id = "p3";
var p4 = playerObj();
p4.id = "p4";

var playersArr = [];
playersArr.push(p1, p2, p3, p4);

var amountCols, amountLines;
var startBlocks;

//music

var muted = false;
var bpm = 180;
var musicBuffers = [];

//---- ONLOAD VARIABLES ----

// general game related vars
var scoreText, playground, blocks, players, explosions, powerups, menus;
var width, height, blockSize, margin;
var speedLimit;
var loopFunctionId;
var loading, filesToLoad;

// for music
var audioCtx, oscillator, gainNodeOsc, gainNodeMusic;
var deathSound, shortTick, startingSound, music;
var explosionSoundFile = "bomb.wav";
var nowPlaying;
var musicScrollLoopId;

// for fps counter
var fpsFunctionId;
var filterStrength = 15;
var frameTime = 0, lastLoop = new Date, thisLoop;



// ---- HELPER FUNCTIONS ----

function posIsInArr(a, b) { //check if array a is in array of arrays b
    for (var i = 0; i < b.length; i++) {
        if (a[0] == b[i][0] && a[1] == b[i][1]) {
            return true;
        }
    }
    return false;
}

function posIsEqual(pos1, pos2) {
    return (pos1.column == pos2.column && pos1.line == pos2.line);
}

// ---- the rest ----
// -------------------------------------------------------
window.onload = function () { //operations that start after page has been loaded

    menus = document.getElementById("menus");
    playground = document.getElementById("playground");
    blocks = document.getElementById("blocks");
    players = document.getElementById("players");
    explosions = document.getElementById("explosions");
    powerups = document.getElementById("powerups");
    var viewBox = playground.getAttribute("viewBox");
    var viewBoxArr = viewBox.split(" ");
    width = Number(viewBoxArr[2]); //playground.getBoundingClientRect().width not working
    height = Number(viewBoxArr[3]);
    margin = width / 14;

    //music stuff
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    catch (e) {
        alert("Web Audio API not supported, please use the latest version of Chrome or Firefox");
    }

    gainNodeOsc = audioCtx.createGain();
    gainNodeEffects = audioCtx.createGain();
    gainNodeMusic = audioCtx.createGain();

    gainNodeOsc.gain.value = 0.04;
    gainNodeOsc.connect(audioCtx.destination);
    gainNodeEffects.gain.value = 0.08;
    gainNodeEffects.connect(audioCtx.destination);
    gainNodeMusic.gain.value = 0.16;
    gainNodeMusic.connect(audioCtx.destination);
    initSounds();
    playSound(explosionSoundFile);
    music.play();


    assignGamepads();
    displaySplashscreen();

    //load music files
    filesToLoad = musicFiles.length;
    loading = filesToLoad;
    for (var i = 0; i < musicFiles.length; i++) {
        loadMusic(musicFiles[i]);
    }

    window.addEventListener("gamepadconnected", function(e) {
        console.log("Gamepad connected at index %d: %s. %d buttons, %d axes.",
            e.gamepad.index, e.gamepad.id,
            e.gamepad.buttons.length, e.gamepad.axes.length);
        assignGamepads();
    });

    document.getElementById("settingsIcon").addEventListener("click", settingsListener);
    document.getElementById("soundIcon").addEventListener("click", soundListener);
};

function settingsListener() {
    displayPause();
}

function soundListener() {
    toggleMute();
}

function updateFPSCounter() {
    document.getElementById("fpsText").textContent = "" + (1000/frameTime).toFixed(1);
}

function assignGamepads(){
    var gamepads = navigator.getGamepads ? navigator.getGamepads() : (navigator.webkitGetGamepads ? navigator.webkitGetGamepads() : []);
    for (var i = 0; i < gamepads.length; i++) {

function playNote(time, note) { //duration in semiquavers
    var start = time * 1000 * 60 / bpm / 4;
    var stop = start + (note.duration * 1000 * 60 / bpm / 4);

    var oscillator = audioCtx.createOscillator();
    oscillator.connect(gainNodeOsc);

    oscillator.type = note.type;
    oscillator.frequency.value = 440; // value in hertz
    oscillator.detune.value = note.getNoteValue()*100;


    setTimeout(function() {
        oscillator.start();
        console.log(note.note);
    }, start);
    setTimeout(function() {
        oscillator.stop();
    }, stop - 2);
}


function NoteObj(note, dur, type) {
    if (!note) note = 0;
    if (!dur) dur = 4;
    if (!type) type = "sawtooth";
    return {
        note: note,
        duration: dur,
        type: type,
        getNoteValue: function () {
            var retVal = 0;
            var octaveIndex = 1;

            charArr = this.note.split("");
            switch (charArr[0]) {
                case "C":
                    retVal = 0;
                    break;
                case "D":
                    retVal = 2;
                    break;
                case "E":
                    retVal = 4;
                    break;
                case "F":
                    retVal = 5;
                    break;
                case "G":
                    retVal = 7;
                    break;
                case "A":
                    retVal = 9;
                    break;
                case "B":
                    retVal = 10;
                    break;
                case "H":
                    retVal = 11;
                    break;
            }

            switch (charArr[1]) {
                case "i":
                    retVal++;
                    octaveIndex = 3;
                    break;
                case "e":
                    retVal--;
                    octaveIndex = 3;
                    break;
                case "s":
                    retVal--;
                    octaveIndex = 2;
                    break;
            }

            retVal += 12 * (parseInt(this.note.substr(octaveIndex, this.note.length + 1)) - 2);
            return retVal;
        }
    };
}

function SheetObj(timeLength) {
    if (!timeLength) timeLength = 128;
    var retObj = {
        timeLength: timeLength,
        play: function() {
            for (var curTime = 0; curTime <  this.timeLength; curTime++) {
                if (this[curTime]) {
                    for (var i = 0; i < this[curTime].length; i++) {
                        playNote(curTime, this[curTime][i]);
                    }
                }
            }
        }
    };

    for (var curTime = 0; curTime < timeLength; curTime++) {
        retObj[curTime] = [];
    }

    return retObj;
}

function playSound(file) { // tell the source which soundfile to play (as string)
    var request = new XMLHttpRequest();
    var source = audioCtx.createBufferSource();

    request.open('GET', "sounds/" + file, true);
    request.responseType = 'arraybuffer';
    request.onload = function() {
        audioCtx.decodeAudioData(request.response, function(buffer) {
            audioCtx.decodeAudioData(request.response, function(buffer) {
                    source.buffer = buffer;
                    source.connect(gainNodeEffects);
                    source.start(0);
                },
                function(e){
                    console.log("Error with decoding audio data" + e.err);
                }
            );
        }, null);
    };
    request.send();
}

function scrollText(fileName) {
    var text = document.getElementById("musicText").textContent;
    if (text.length > 15 && fileName.length > 23) {
        document.getElementById("musicText").textContent = text.substring(4, text.length);
    }
    else {
        document.getElementById("musicText").textContent = text.substring(4, text.length) + "           " + fileName;
    }
}

function playRandomMusic(exception) { //exception = file not to play
    var rand = Math.floor(Math.random() * musicFiles.length);
    if (musicFiles.length > 1 && (!musicBuffers[rand] || (exception && exception == musicFiles[rand]))) {
        while ((exception == musicFiles[rand] || !musicBuffers[rand])) {
            rand = Math.floor(Math.random() * musicFiles.length);
        }
    }
    playMusic(rand);
}

function loadMusic(file) {
    var request = new XMLHttpRequest();
    if (nowPlaying) {
        clearInterval(musicScrollLoopId);
        nowPlaying.onended = null;
        nowPlaying.stop();
    }
    request.open('GET', "sounds/" + file, true);
    request.responseType = 'arraybuffer';
    request.onload = function() {
        audioCtx.decodeAudioData(request.response, function(buffer) {
                musicBuffers.push(buffer);
                loading--;
            },
            function(e){
                console.log("Error with decoding audio data" + e.err);
            }
        );
    };
    request.send();
}

function playMusic(nr) { // tell the source which soundfile to play (number)
    var source = audioCtx.createBufferSource();
    if (nowPlaying) {
        clearInterval(musicScrollLoopId);
        nowPlaying.onended = null;
        nowPlaying.stop();
    }

    source.buffer = musicBuffers[nr];
    source.connect(gainNodeMusic);
    nowPlaying = source;
    document.getElementById("musicText").textContent = musicFiles[nr].substring(0, musicFiles[nr].length - 4);
    musicScrollLoopId = setInterval(function() {
        scrollText(musicFiles[nr].substring(0, musicFiles[nr].length - 4));
    }, 1000);

    source.start();
    source.onended = function() {
        playRandomMusic(nr);
    };
}

function toggleMute() {
    if (muted) {
        gainNodeOsc.connect(audioCtx.destination);
        gainNodeEffects.connect(audioCtx.destination);
        gainNodeMusic.connect(audioCtx.destination);
        document.getElementById("soundIcon").setAttributeNS("http://www.w3.org/1999/xlink", "href", "#icons__soundPlayingIcon");

    else {
        gainNodeOsc.disconnect();
        gainNodeEffects.disconnect();
        gainNodeMusic.disconnect();
        document.getElementById("soundIcon").setAttributeNS("http://www.w3.org/1999/xlink", "href", "#icons__soundMutedIcon");
    }
    muted = !muted;
}

function getGridCoords(x, y) { // returns object with coordinates of the game's grid

    pos.column = Math.round((x - margin) / (blockSize + ((width - margin*2) - amountCols * blockSize) / (amountCols )));
    pos.line = Math.round((y - margin) / (blockSize +  ((width - margin*2) - amountLines * blockSize) / (amountLines)));

function calculateDir(player) {
    var x = ((player.curSpeedX / Math.abs(player.curSpeedX))) * 4; // x: -4, 0 or 4
    var y = (player.curSpeedY / Math.abs(player.curSpeedY)); // y: -1, 0 or 1
    x = x ? x : 0;
    y = y ? y : 0;
    switch(x+y) {
        case 1: return "180deg";
        case -3: return "-135deg";
        case -4: return "-90deg";
        case -5: return "-45deg";
        case -1: return "0deg";
        case 3: return "45deg";
        case 4: return "90deg";
        case 5: return "135deg";
        default: return null;
    }
}

function adjustPlayerHeading(player) { //changes players use element to the current heading when he is moving
    var heading = calculateDir(player);
    if (heading) {
        document.getElementById(player.id).children[0].setAttribute("style", "transform: rotate(" + heading + "); " +
            "-webkit-transform: rotate(" + heading + "); -moz-transform: rotate(" + heading + ");");
    }
}

function gameControlsDown(e) {
    var key = e.keyCode ? e.keyCode : e.which;
    var player;
    if (key == 27) {
       displayPause();
    }

    var arrowKeys = [32, 37, 38, 39, 40];

    if (arrowKeys.indexOf(key) >= 0) {
        e.preventDefault();
    }

    for (var i = 1; i <= 4; i++) {
        player = playersArr[i-1];

        if (player.alive) {
            if (key === PLACE_BOMB[i-1]) {
                player.placingBombs = true;
            } else if (key === DIRECTION_UP[i-1]) {
                player.curSpeedY = -player.maxSpeed * player.walkingDirectionMult;
                adjustPlayerHeading(player);
            } else if (key === DIRECTION_DOWN[i-1]) {
                player.curSpeedY = +player.maxSpeed * player.walkingDirectionMult;
                adjustPlayerHeading(player);
            } else if (key === DIRECTION_LEFT[i-1]) {
                player.curSpeedX = -player.maxSpeed * player.walkingDirectionMult;
                adjustPlayerHeading(player);
            } else if (key === DIRECTION_RIGHT[i-1]) {
                player.curSpeedX = +player.maxSpeed * player.walkingDirectionMult;
                adjustPlayerHeading(player);
            }
        }
    }
}

// -------------------------------------------------------
function gameControlsUp(e) { // implement keystate?
    var key = e.keyCode ? e.keyCode : e.which;
    var player;
    for (var i = 1; i <= 4; i++) {
        player = playersArr[i - 1];
        if (player.alive) {
            if (key === PLACE_BOMB[i-1] || key === 16) {
                player.placingBombs = player.forcePlacingBombs;
            } else if (key === DIRECTION_UP[i-1] && player.maxSpeed * player.walkingDirectionMult * player.curSpeedY < 0) {
                player.curSpeedY = 0;
                adjustPlayerHeading(player);
            } else if (key === DIRECTION_DOWN[i-1] && player.maxSpeed * player.walkingDirectionMult * player.curSpeedY > 0) {
                player.curSpeedY = 0;
                adjustPlayerHeading(player);
            } else if (key === (DIRECTION_LEFT[i-1]) && player.maxSpeed * player.walkingDirectionMult * player.curSpeedX < 0) {
                player.curSpeedX = 0;
                adjustPlayerHeading(player);
            } else if (key === DIRECTION_RIGHT[i-1] && player.maxSpeed * player.walkingDirectionMult * player.curSpeedX > 0) {
                player.curSpeedX = 0;
                adjustPlayerHeading(player);
            }
        }
    }
}

function gamepadControls() {
    assignGamepads();
    for (var i = 0; i < nrOfPlayers; i++) {
        var player = playersArr[i];
        if (player.gamepad) {
            var controller = player.gamepad;

            //buttons
            /* all buttons
            for (i = 0; i < controller.buttons.length; i++) {
                var val = controller.buttons[i];
                var pressed = val == 1.0;
                if (typeof(val) == "object") {
                    pressed = val.pressed;
                    val = val.value;
                }
                if (pressed) {
                    console.log(i, val, pressed);
                }
            } */


            player.placingBombs = controller.buttons[0].pressed || player.forcePlacingBombs;

            //sticks
            for (var j = 0; j < controller.axes.length; j++) {
                player.curSpeedX = controller.axes[0] * player.maxSpeed * player.walkingDirectionMult;
                player.curSpeedY = controller.axes[1] * player.maxSpeed * player.walkingDirectionMult;

                if (Math.abs(controller.axes[0]) < 0.20) {
                    player.curSpeedX = 0;
                }
                else { //diagonal max speed is 0.7 in x and y direction, adjusting for that
                    var dirX = player.curSpeedX / Math.abs(player.curSpeedX);
                    player.curSpeedX += 0.3 * dirX;
                    if (Math.abs(player.curSpeedX) > player.maxSpeed) {
                        player.curSpeedX = player.maxSpeed * dirX;
                    }
                }

                if (Math.abs(controller.axes[1]) < 0.20) {
                    player.curSpeedY = 0;
                }
                else {
                    var dirY = player.curSpeedY / Math.abs(player.curSpeedY);
                    player.curSpeedY += 0.3 * dirY;
                    if (Math.abs(player.curSpeedY) > player.maxSpeed) {
                        player.curSpeedY = player.maxSpeed * dirY;
                    }
                }

                adjustPlayerHeading(player);
            }
        }

    }
}

function updatePlayers() {
    var player, playersAlive = 0;
    for (var i = 0; i < nrOfPlayers; i++) {
        if (playersArr[i].alive) {
            playersAlive++;
            player = playersArr[i];
        }
        else {
            continue;
        }

        var curPos = {column: player.column, line: player.line};
        var nextPosX = getGridCoords(player.x + player.curSpeedX, player.y);
        var curBlock = getBlock(curPos);

        if ((curBlock !== null && posIsEqual(curPos, nextPosX)) || getBlock(nextPosX) === null) {
            player.x += player.curSpeedX;
        }

        var nextPosY = getGridCoords(player.x, player.y + player.curSpeedY);
        if ((curBlock !== null && posIsEqual(curPos, nextPosY))|| getBlock(nextPosY) === null) {
            player.y += player.curSpeedY;
        }

        var newPos = getGridCoords(player.x, player.y);
        player.column = newPos.column;
        player.line = newPos.line;

        var localExplosion = checkForExplosion(player);
        if (localExplosion !== null) {
            killPlayer(player);
            for (var j = 0; j < nrOfPlayers; j++) {
                var owner = localExplosion.getAttribute("owner");
                if (playersArr[j].id == owner) {
                    if (player.id == owner) {
                        playersArr[j].score--;
                        document.getElementById("score" + (j + 1)).textContent = playersArr[j].score;
                    }
                    else {
                        playersArr[j].score += 3;
                        document.getElementById("score" + (j + 1)).textContent = playersArr[j].score;
                    }
                }
            }
        }
        if (player.placingBombs) {
            placeBomb(player);
        }
        pickupPowerup(player);

        if (player.alive) {
            //document.getElementById(player.id).setAttribute("style", "top: " + player.y + "px; left: " + player.x + "px;");
            document.getElementById(player.id).setAttribute("x", "" + player.x);
            document.getElementById(player.id).setAttribute("y", "" + player.y);
        }
    }
    if (nrOfPlayers > 1 && playersAlive <= 1) {
        clearInterval(loopFunctionId);
        setTimeout(startNewRound, 2000);
    }
}

function checkForExplosion(player) {
    var explArr = explosions.children;
    for (var i = 0; i < explArr.length; i++) {
        if (explArr[i].getAttribute("column") == player.column &&
            explArr[i].getAttribute("line") == player.line) {
            return explArr[i];
        }
    }
    return null;
}

function updateBlocks() {
    var blocksArr = blocks.children;
    var block, newTicker, explNr;
    for (var i = 0; i < blocksArr.length; i++) {
        block = blocksArr[i];
        if (block.getAttribute("type") == "bomb") {
            newTicker = block.getAttribute("ticker") - 1;
            block.setAttribute("ticker", "" + (newTicker));

            explNr = 3 - + Math.floor(3 * (Number(newTicker) / bombDelay));
            block.children[0].setAttributeNS("http://www.w3.org/1999/xlink", "href", "#bomb__bomb" + explNr);

            if (newTicker <= 0) {
                explode(block);
            }
        }
    }

    var explArr = explosions.children;
    for (i = 0; i < explArr.length; i++) {
        block = explArr[i];
        newTicker = block.getAttribute("ticker") - 1;
        block.setAttribute("ticker", "" + (newTicker));
        explNr = 1 + Math.floor(12 * (Number(newTicker) / explosionTime));
        block.children[0].setAttributeNS("http://www.w3.org/1999/xlink", "href", "#explosion");

        if (newTicker <= 0) {
            if (block.getAttribute("brokeBox") == "true") {
                spawnPowerup(block);
            }
            explosions.removeChild(block);
        }
    }
}

function explode(bomb) {
    playSound(explosionSoundFile); //play sound
    //remove bomb from game before explosion
    blocks.removeChild(bomb);
    var bombX = Number(bomb.getAttribute("x"));
    var bombY = Number(bomb.getAttribute("y"));
    var bombCol = Number(bomb.getAttribute("column"));
    var bombLine = Number(bomb.getAttribute("line"));
    var owner = bomb.getAttribute("owner");

    var expl = getNewExpl(bombX, bombY, bombCol, bombLine, owner);
    explosions.appendChild(expl);
    var nextBlock, nextPowerup, nextExpl;
    var hasBrokenBox;

    //give player a bomb back
    for (var j = 0; j < 4; j++) {
        if (playersArr[j].id == bomb.getAttribute("owner")) {
            playersArr[j].bombCount++;
            break;
        }

    // explode up

        nextExplosion =
        nextBlock = getBlock({column: bombCol, line: bombLine - i});

        if (nextExpl !== null) { //check if box has already been broken here
            hasBrokenBox = false;

        blockWrapper.setAttribute("y", "" + block.getAttribute("y"));
        blockWrapper.setAttribute("column", "" + block.getAttribute("column"));
        blockWrapper.setAttribute("line", "" + block.getAttribute("line"));
        blockWrapper.setAttribute("width", "" + blockSize);
        blockWrapper.setAttribute("height", "" + blockSize);
        blockWrapper.setAttribute("type", "powerupRandom");
        powerups.appendChild(blockWrapper);
        blockWrapper.appendChild(powerup);
    }
}

function pickupPowerup(player) {
    var powerup = getPowerup(player);
    if (powerup !== null) {
        if (powerup.getAttribute("type") == "powerupAmount") {
            player.bombCount++;
        }
        else if (powerup.getAttribute("type") == "powerupSpeed") {
            player.maxSpeed += 0.07 * speedLimit;
            if (player.maxSpeed > speedLimit) {
                player.maxSpeed = speedLimit;
            }
        }
        else if(powerup.getAttribute("type") == "powerupPower") {
            player.bombPower++;
        }
        else if(powerup.getAttribute("type") == "powerupRandom") {
            var rand = Math.random();
            console.log(rand);
            if(rand <= 0.25) {
                player.bombCount++;
            }
            else if (rand <= 0.45){
                player.maxSpeed += 0.07 * speedLimit;
                if (player.maxSpeed > speedLimit) {
                    player.maxSpeed = speedLimit;
                }
            }
            else if (rand <= 0.65) {
                player.bombPower++;
            }
            else if (rand <= 0.75) {
                player.placingBombs = true;
                player.forcePlacingBombs = true;
                setTimeout(function() {
                    player.placingBombs = false;
                    player.forcePlacingBombs = false;
                }, 6000);
            }
            else {
                if (player.walkingDirectionMult == 1) {
                    var confusedSVG = document.createElementNS("http://www.w3.org/2000/svg", "use");
                    var playerParent = document.getElementById(player.id);
                    confusedSVG.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#player__confused");
                    playerParent.appendChild(confusedSVG);
                    player.walkingDirectionMult = -1;
                    player.curSpeedX = -player.curSpeedX;
                    player.curSpeedY = -player.curSpeedY;
                    setTimeout(function() {
                        player.walkingDirectionMult = 1;
                        player.curSpeedX = -player.curSpeedX;
                        player.curSpeedY = -player.curSpeedY;
                        playerParent.removeChild(playerParent.children[1]); // confusion will always be the second child but only as long as there are no other effects
                    }, 6000);
                }
            }

        }
        powerups.removeChild(powerup);
    }
}</script>
<script>(function(){
if(typeof updatePlayers!=='function')return;
var DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
var frame=0,scanFrame=-1,S=null;
function kindOf(b){var t=b.getAttribute('type');if(t)return t;var u=b.children[0];var h=(u&&(u.getAttribute('href')||u.getAttributeNS('http://www.w3.org/1999/xlink','href')))||'';return h.indexOf('stone')>=0?'stone':h.indexOf('box')>=0?'box':h.indexOf('bomb')>=0?'bomb':'x'}
function inb(c,l){return c>=0&&l>=0&&(!window.amountCols||c<window.amountCols)&&(!window.amountLines||l<window.amountLines)}
function blast(g,b,danger){
danger[b.c+','+b.l]=1;
for(var i=0;i<4;i++){for(var n=1;n<=b.p;n++){var c=b.c+DIRS[i][0]*n,l=b.l+DIRS[i][1]*n,k=g[c+','+l];
if(k==='stone')break;danger[c+','+l]=1;if(k==='box')break;}}
}
function scan(){
var g={},bombs=[],danger={},pw={},i,ch=blocks.children;
for(i=0;i<ch.length;i++){var b=ch[i],c=parseInt(b.getAttribute('column'),10),l=parseInt(b.getAttribute('line'),10);
if(isNaN(c)||isNaN(l))continue;var k=kindOf(b);g[c+','+l]=k;
if(k==='bomb')bombs.push({c:c,l:l,p:parseInt(b.getAttribute('power'),10)||2});}
var ex=explosions.children;
for(i=0;i<ex.length;i++)danger[ex[i].getAttribute('column')+','+ex[i].getAttribute('line')]=1;
for(i=0;i<bombs.length;i++)blast(g,bombs[i],danger);
var pc=powerups.children;
for(i=0;i<pc.length;i++)pw[pc[i].getAttribute('column')+','+pc[i].getAttribute('line')]=1;
return {g:g,danger:danger,pw:pw};
}
function getScan(){if(scanFrame!==frame){S=scan();scanFrame=frame}return S}
function passable(s,c,l){return inb(c,l)&&!s.g[c+','+l]}
function bfs(s,sc,sl,goal,avoid,maxD,dg){
dg=dg||s.danger;
var q=[{c:sc,l:sl,f:null,d:0}],seen={},h=0;seen[sc+','+sl]=1;
while(h<q.length){var n=q[h++];
if(n.d>0&&goal(n.c,n.l))return n;
if(n.d>=maxD)continue;
for(var i=0;i<4;i++){var c=n.c+DIRS[i][0],l=n.l+DIRS[i][1],k=c+','+l;
if(seen[k]||!passable(s,c,l))continue;
if(avoid&&dg[k])continue;
seen[k]=1;q.push({c:c,l:l,f:n.f||{c:c,l:l},d:n.d+1});}}
return null;
}
function safeToBomb(s,p,c,l){
var dg={},k;for(k in s.danger)dg[k]=1;
blast(s.g,{c:c,l:l,p:p.bombPower||2},dg);
var bd=(typeof bombDelay!=='undefined')?bombDelay:150;
var cellFrames=Math.max(1,blockSize/Math.max(p.maxSpeed,0.1));
var maxD=Math.max(2,Math.min(7,Math.floor(bd*0.7/cellFrames)));
return !!bfs(s,c,l,function(a,b){return !dg[a+','+b]},false,maxD,dg);
}
function enemies(p){var r=[];for(var i=0;i<playersArr.length;i++){var q=playersArr[i];if(q!==p&&q.alive)r.push(q)}return r}
function stop(p){p.curSpeedX=0;p.curSpeedY=0}
function decide(p,bot,s,cur){
var c=cur.column,l=cur.line,here=c+','+l,sp=p.maxSpeed,cc=getCSSCoords(c,l),d,k;
if(Math.abs(p.x-cc.x)>sp||Math.abs(p.y-cc.y)>sp){bot.t={c:c,l:l};return}
if(s.danger[here]){
var e=bfs(s,c,l,function(a,b){return !s.danger[a+','+b]},false,10);
if(e)bot.t=e.f;
return;
}
var en=enemies(p);
if(p.bombCount>0&&!s.g[here]&&bot.cd<=0){
var want=false;
for(d=0;d<4;d++){if(s.g[(c+DIRS[d][0])+','+(l+DIRS[d][1])]==='box')want=true}
if(!want){for(var i=0;i<en.length;i++){var q=en[i];
if(Math.abs(q.column-c)+Math.abs(q.line-l)<=3&&(q.column===c||q.line===l||Math.abs(q.column-c)+Math.abs(q.line-l)<=2))want=true}}
if(want&&Math.random()<0.8&&safeToBomb(s,p,c,l)){p.placingBombs=true;bot.cd=90;return}
}
var goal=bfs(s,c,l,function(a,b){return s.pw[a+','+b]},true,6);
if(!goal&&en.length&&Math.random()<0.4){
var best=null,bd2=999;
for(var j=0;j<en.length;j++){var m=Math.abs(en[j].column-c)+Math.abs(en[j].line-l);if(m<bd2){bd2=m;best=en[j]}}
if(best)goal=bfs(s,c,l,function(a,b){return Math.abs(a-best.column)+Math.abs(b-best.line)<=2},true,16);
}
if(!goal){
goal=bfs(s,c,l,function(a,b){for(var d2=0;d2<4;d2++){if(s.g[(a+DIRS[d2][0])+','+(b+DIRS[d2][1])]==='box')return true}return false},true,16);
}
if(goal){bot.t=goal.f;return}
var opts=[];
for(d=0;d<4;d++){var nc=c+DIRS[d][0],nl=l+DIRS[d][1];k=nc+','+nl;if(passable(s,nc,nl)&&!s.danger[k])opts.push({c:nc,l:nl})}
if(opts.length)bot.t=opts[Math.floor(Math.random()*opts.length)];
}
function move(p,bot){
var pos=getCSSCoords(bot.t.c,bot.t.l),dx=pos.x-p.x,dy=pos.y-p.y,sp=p.maxSpeed,ox=p.curSpeedX,oy=p.curSpeedY;
if(Math.abs(dx)>sp){p.curSpeedX=dx>0?sp:-sp;p.curSpeedY=0}
else if(Math.abs(dy)>sp){p.curSpeedX=0;p.curSpeedY=dy>0?sp:-sp}
else stop(p);
if(ox!==p.curSpeedX||oy!==p.curSpeedY){try{adjustPlayerHeading(p)}catch(e){}}
}
function think(p){
if(!p)return;
var bot=p._bot||(p._bot={t:null,cd:0});
bot.cd--;
p.placingBombs=false;
if(!p.alive||!(p.maxSpeed>0)){bot.t=null;return}
var s=getScan(),sp=p.maxSpeed,cur=getGridCoords(p.x,p.y);
if(bot.t){
var pos=getCSSCoords(bot.t.c,bot.t.l),dx=pos.x-p.x,dy=pos.y-p.y;
var same=cur.column===bot.t.c&&cur.line===bot.t.l;
if(Math.abs(dx)>blockSize*1.6||Math.abs(dy)>blockSize*1.6||(!same&&s.g[bot.t.c+','+bot.t.l])){bot.t=null;stop(p)}
else if(Math.abs(dx)<=sp&&Math.abs(dy)<=sp){p.x=pos.x;p.y=pos.y;bot.t=null;stop(p)}
}
if(!bot.t)decide(p,bot,s,cur);
if(bot.t)move(p,bot);else stop(p);
}
var _up=window.updatePlayers;
var HUMAN_SPEED=1.7;
window.updatePlayers=function(){
frame++;
var h=playersArr[0];
if(h&&h.alive&&h.maxSpeed>0){
if(h.curSpeedX)h.curSpeedX=(h.curSpeedX>0?1:-1)*h.maxSpeed*HUMAN_SPEED;
if(h.curSpeedY)h.curSpeedY=(h.curSpeedY>0?1:-1)*h.maxSpeed*HUMAN_SPEED;
}
try{for(var i=1;i<4;i++)think(playersArr[i])}catch(e){}
return _up.apply(this,arguments);
};
['initGame','startGame','countdownAndStartLoop','startNewRound'].forEach(function(n){
var f=window[n];if(typeof f!=='function')return;
window[n]=function(){window.nrOfPlayers=4;return f.apply(this,arguments)};
});
})();</script>
<script>(function(){
var MAP={u:87,d:83,l:65,r:68,b:16};
['contextmenu','selectstart','dragstart'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
function fire(t,c){var e=new Event(t,{bubbles:true,cancelable:true});
Object.defineProperty(e,'keyCode',{get:function(){return c}});
Object.defineProperty(e,'which',{get:function(){return c}});
(document.body||document).dispatchEvent(e)}
document.querySelectorAll('[data-k]').forEach(function(btn){
var c=MAP[btn.dataset.k],on=false;
function down(e){e.preventDefault();try{btn.setPointerCapture(e.pointerId)}catch(_){}if(on)return;on=true;fire('keydown',c)}
function up(e){e.preventDefault();if(!on)return;on=false;fire('keyup',c)}
btn.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});
btn.addEventListener('pointerdown',down);
['pointerup','pointerleave','pointercancel'].forEach(function(n){btn.addEventListener(n,up)});
});
})();</script>
