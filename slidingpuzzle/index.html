<style>

:root{
  --accent-a:#8b6cf0;
  --accent-b:#4fa8e0;
  --ink:#f2f5f7;
  --ink-dim:rgba(242,245,247,.55);
  --ink-faint:rgba(242,245,247,.4);
}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{width:100%;max-width:620px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,rgba(34,45,53,.97),rgba(24,33,40,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.head{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--accent-b);opacity:.85}
.title{font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.value{font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;font-variant-numeric:tabular-nums}
.label{font-size:8px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-bottom:3px}
.main{padding:16px}
.board{position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),rgba(0,0,0,0) 60%),rgba(4,9,12,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;margin-top:12px;justify-content:center}
.button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;background:rgba(255,255,255,.06);padding:0 16px;transition:transform .08s ease,filter .08s ease}
.button:active{transform:scale(.94);filter:brightness(1.15)}
.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(139,108,240,.35)}
.status{text-align:center;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);letter-spacing:.3px;margin-top:12px;min-height:12px}
.overlay{position:absolute;inset:0;background:rgba(10,15,19,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;animation:fade-in .18s ease}
.overlay.hidden{display:none}
.overlay-title{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#fff,var(--accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.2px;margin-top:8px;max-width:280px}
@keyframes fade-in{from{opacity:0}to{opacity:1}}


* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #30345f 0%, #17182c 48%, #0d0d17 100%);
}

button {
  font-family: Arial, sans-serif;
}

.hidden {
  display: none !important;
}

/* ============================================================
   APP
   ============================================================ */
#app {
  width: 100%;
  min-height: 100vh;
  padding: 10px;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   NÍVEIS
   ============================================================ */

.level-screen {
  width: 100%;
  max-width: 370px;
  min-height: 90vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
}

.level-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.level-title h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 800;
}

.subtitle {
  margin: 8px 0 22px;
  opacity: .72;
  font-size: 14px;
}

.level-buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.level-btn {
  width: 100%;
  padding: 15px;

  border-radius: 15px;
  border: 2px solid rgba(255,255,255,.16);

  background: rgba(255,255,255,.08);

  color: white;
  cursor: pointer;

  transition: .12s;
}

.level-btn:active {
  transform: scale(.97);
}

.level-name {
  display: block;
  font-size: 19px;
  font-weight: 800;
}

.level-desc {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  opacity: .68;
}

/* ============================================================
   JOGO
   ============================================================ */

.game-screen {
  width: 100%;
  min-height: 92vh;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.game-header {
  width: 100%;
  max-width: 520px;

  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;

  margin-bottom: 8px;
}

.game-header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
}

.badge {
  padding: 4px 9px;
  border-radius: 20px;
  background: rgba(255,255,255,.14);

  font-size: 11px;
  font-weight: 700;
}

.moves {
  margin-left: auto;
  font-size: 13px;
  font-weight: 700;
}

.actions {
  width: 100%;

  display: flex;
  justify-content: flex-end;
  gap: 7px;
}

.btn {
  border: 0;
  border-radius: 9px;

  padding: 8px 12px;

  background: rgba(255,255,255,.17);
  color: white;

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;
}

.btn:active {
  transform: scale(.95);
}

.btn-ghost {
  background: transparent;
  border: 1px solid rgba(255,255,255,.28);
}

/* ============================================================
   TABULEIRO
   ============================================================ */

.board-container {
  flex: 1;
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;
}

.board {
  width: min(94vw, 430px);
  height: min(94vw, 430px);

  padding: 5px;

  display: grid;

  gap: 3px;

  background: #10101f;
  border-radius: 14px;

  box-shadow: 0 12px 35px rgba(0,0,0,.55);

  touch-action: manipulation;
}

.board.size-3 {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
}

.board.size-4 {
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
}

.board.size-5 {
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(5, 1fr);
}

/* ============================================================
   PEÇAS
   ============================================================ */

.tile {
  position: relative;

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  overflow: hidden;

  border-radius: 5px;

  border: 1px solid rgba(255,255,255,.15);

  background-color: #18203d;

  cursor: pointer;

  user-select: none;

  touch-action: manipulation;

  transition:
    transform .08s ease,
    filter .08s ease;
}

.tile:active {
  transform: scale(.95);
  filter: brightness(1.15);
}

.tile.empty {
  background-color: #090914;
  background-image: none !important;
  border-color: rgba(255,255,255,.05);
  cursor: default;
}

/* ============================================================
   VITÓRIA
   ============================================================ */

.win-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.78);

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 999;

  padding: 20px;
}

.win-box {
  width: 100%;
  max-width: 330px;

  padding: 25px;

  text-align: center;

  border-radius: 18px;

  background:
    linear-gradient(145deg,#1c1d35,#111221);

  border: 1px solid rgba(255,255,255,.2);

  box-shadow: 0 15px 50px rgba(0,0,0,.6);
}

.win-box h2 {
  margin: 0 0 8px;
  font-size: 25px;
}

.win-box p {
  margin: 0 0 20px;
  opacity: .75;
}

.win-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ============================================================
   AJUDA
   ============================================================ */

.help-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.8);

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 1000;

  padding: 20px;
}

.help-box {
  width: 100%;
  max-width: 340px;

  padding: 22px;

  border-radius: 16px;

  background: #18192b;

  border: 1px solid rgba(255,255,255,.2);
}

.help-box h2 {
  margin: 0 0 15px;
}

.help-box p {
  font-size: 14px;
  line-height: 1.5;
  opacity: .85;
}

@media(max-width:500px) {
  .board {
    width: min(94vw, 410px);
    height: min(94vw, 410px);
  }
}

  };

  const LEVELS = {
    easy: 3,
    medium: 4,
    hard: 5
  };

  const SHUFFLES = {
    easy: 80,
    medium: 180,
    hard: 350
  };

  const state = {
    level: "easy",
    size: 3,
    grid: [],
    empty: 0,
    moves: 0
  };

  const $ = (id) => document.getElementById(id);

  /* ============================================================
     VIZINHOS
     ============================================================ */
  function neighbors(index) {
    const row = Math.floor(index / state.size);
    const col = index % state.size;

    const result = [];

    if (row > 0) {
      result.push(index - state.size);
    }

    if (row < state.size - 1) {
      result.push(index + state.size);
    }

    if (col > 0) {
      result.push(index - 1);
    }

    if (col < state.size - 1) {
      result.push(index + 1);
    }

    return result;
  }

  /* ============================================================
     EMBARALHAR
     ============================================================ */

  function shuffle() {

    const total = state.size * state.size;

    state.grid = [];

    for (let i = 1; i < total; i++) {
      state.grid.push(i);
    }

    state.grid.push(0);

    state.empty = total - 1;

    let previous = -1;

    const amount = SHUFFLES[state.level];

    for (let i = 0; i < amount; i++) {

      let possible = neighbors(state.empty);

      if (possible.length > 1 && previous !== -1) {
        possible = possible.filter(
          x => x !== previous
        );
      }

      const next =
        possible[
          Math.floor(
            Math.random() * possible.length
          )
        ];

      [state.grid[state.empty], state.grid[next]] =
      [state.grid[next], state.grid[state.empty]];

      previous = state.empty;

      state.empty = next;
    }

    state.moves = 0;
  }

  /* ============================================================
     RENDER
     ============================================================ */

  function render() {
    const board = document.getElementById("board");
    const size = state.size;

    board.className = "board size-" + size;
    board.innerHTML = "";

    const total = size * size;
    const imageUrl = IMAGES[state.level];

    for (let i = 0; i < total; i++) {
      const value = state.grid[i];

      const tile = document.createElement("div");
      tile.className = "tile";

      if (value === 0) {
        tile.classList.add("empty");
        board.appendChild(tile);
        continue;
      }

      const piece = value - 1;

      const originalRow = Math.floor(piece / size);
      const originalCol = piece % size;

      tile.style.backgroundImage = "url(\"" + imageUrl + "\")";
      tile.style.backgroundRepeat = "no-repeat";
      tile.style.backgroundSize =
        (size * 100) + "% " + (size * 100) + "%";

      const x =
        size === 1
          ? 0
          : (originalCol * 100) / (size - 1);

      const y =
        size === 1
          ? 0
          : (originalRow * 100) / (size - 1);

      tile.style.backgroundPosition =
        x + "% " + y + "%";

      tile.dataset.index = i;

      tile.addEventListener("click", () => {
        move(i);
      });

      board.appendChild(tile);
    }

    const movesElement =
      document.getElementById("moves");

    if (movesElement) {
      movesElement.textContent =
        "Movimentos: " + state.moves;
    }
  }

  function move(index) {

    if (!neighbors(state.empty).includes(index)) {
      return;
    }

    [state.grid[state.empty], state.grid[index]] =
    [state.grid[index], state.grid[state.empty]];

    state.empty = index;

    state.moves++;

    render();

    if (checkWin()) {

      $("winMoves").textContent =
        "Movimentos: " + state.moves;

      $("winOverlay").classList.remove("hidden");
    }
  }

  /* ============================================================
     VERIFICAR VITÓRIA
     ============================================================ */

  function checkWin() {

    for (
      let i = 0;
      i < state.grid.length - 1;
      i++
    ) {

      if (state.grid[i] !== i + 1) {
        return false;
      }
    }

    return state.grid[state.grid.length - 1] === 0;
  }

  /* ============================================================
     NOVO JOGO
     ============================================================ */

  function newGame() {

    state.size =
      LEVELS[state.level];

    shuffle();

    render();

    $("winOverlay")
      .classList
      .add("hidden");
  }

  /* ============================================================
     INICIAR NÍVEL
     ============================================================ */

  function startLevel(level) {

    state.level = level;

    const names = {
      easy: "Fácil",
      medium: "Médio",
      hard: "Difícil"
    };

    $("levelBadge").textContent =
      names[level];

    $("levelScreen")
      .classList
      .add("hidden");

    $("gameScreen")
      .classList
      .remove("hidden");

    newGame();
  }

  /* ============================================================
     VOLTAR PARA NÍVEIS
     ============================================================ */

  function levels() {

    $("winOverlay")
      .classList
      .add("hidden");

    $("gameScreen")
      .classList
      .add("hidden");

    $("levelScreen")
      .classList
      .remove("hidden");
  }

  /* ============================================================
     EVENTOS
     ============================================================ */

  document
    .querySelectorAll(".level-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {
          startLevel(
            button.dataset.level
          );
        }
      );

    });

  $("newGameBtn")
    .addEventListener(
      "click",
      newGame
    );

  $("changeLevelBtn")
    .addEventListener(
      "click",
      levels
    );

  $("playAgainBtn")
    .addEventListener(
      "click",
      newGame
    );

  $("changeLevelWinBtn")
    .addEventListener(
      "click",
      levels
    );

  $("helpBtn")
    .addEventListener(
      "click",
      () => {
        $("helpOverlay")
          .classList
          .remove("hidden");
      }
    );

  $("helpClose")
    .addEventListener(
      "click",
      () => {
        $("helpOverlay")
          .classList
          .add("hidden");
      }
    );

  $("helpOverlay")
    .addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          $("helpOverlay")
        ) {
          $("helpOverlay")
            .classList
            .add("hidden");
        }

      }
    );

})();
