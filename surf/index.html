<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Surf Run</title><style>html{background:#0f171c;min-height:100%}body{min-height:100vh}.voltar{position:fixed;left:10px;bottom:10px;z-index:99999;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:12px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)}</style></head>
<style>

:root{
  --accent-a:#8b6cf0;
  --accent-b:#4fa8e0;
  --ink:#f2f5f7;
  --ink-dim:rgba(242,245,247,.55);
  --ink-faint:rgba(242,245,247,.4);
}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{width:100%;max-width:620px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,rgba(34,45,53,.97),rgba(24,33,40,.97));border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.head{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--accent-b);opacity:.85}
.title{font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.value{font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;font-variant-numeric:tabular-nums}
.label{font-size:8px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-bottom:3px}
.main{padding:16px}
.board{position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),rgba(0,0,0,0) 60%),rgba(4,9,12,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;margin-top:12px;justify-content:center}
.button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;background:rgba(255,255,255,.06);padding:0 16px;transition:transform .08s ease,filter .08s ease}
.button:active{transform:scale(.94);filter:brightness(1.15)}
.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(139,108,240,.35)}
.status{text-align:center;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);letter-spacing:.3px;margin-top:12px;min-height:12px}
.overlay{position:absolute;inset:0;background:rgba(10,15,19,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;animation:fade-in .18s ease}
.overlay.hidden{display:none}
.overlay-title{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#fff,var(--accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.2px;margin-top:8px;max-width:280px}
@keyframes fade-in{from{opacity:0}to{opacity:1}}


.game{
  position:relative;
  width:100%;
  height:430px;
  overflow:hidden;
  border-radius:16px;
  background:
    radial-gradient(circle at 82% 12%, rgba(255,236,168,.55) 0%, rgba(255,236,168,0) 22%),
    linear-gradient(
      180deg,
      #0f2138 0%,
      #23507c 35%,
      #6fa3c9 48%,
      #8fbf6c 49%,
      #5f8a4e 65%,
      #4d7440 100%
    );
  box-shadow:inset 0 0 60px rgba(0,0,0,.25);
}

.game.shake{
  animation:screenShake .35s ease;
}

@keyframes screenShake{
  0%,100%{ transform:translate(0,0); }
  20%{ transform:translate(-6px,3px); }
  40%{ transform:translate(5px,-3px); }
  60%{ transform:translate(-4px,2px); }
  80%{ transform:translate(3px,-2px); }
}

/* ESTRELAS / BRILHO */

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  opacity:.7;
  animation:twinkle 2.6s ease-in-out infinite;
}

@keyframes twinkle{
  0%,100%{ opacity:.2; }
  50%{ opacity:.9; }
}

/* CÉU */

.sun{
  position:absolute;
  width:62px;
  height:62px;
  top:30px;
  right:38px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff7d6, #ffe08a 55%, #ffcf5c 100%);
  box-shadow:0 0 55px rgba(255,224,138,.6), 0 0 110px rgba(255,224,138,.25);
}

.mountain{
  position:absolute;
  bottom:46%;
  width:0;
  height:0;
  border-style:solid;
  opacity:.55;
  filter:blur(.3px);
}

.mountain.m1{
  left:-4%;
  border-width:0 60px 70px 60px;
  border-color:transparent transparent #3a5f7f transparent;
}

.mountain.m2{
  left:14%;
  border-width:0 45px 50px 45px;
  border-color:transparent transparent #33587a transparent;
  opacity:.4;
}

.mountain.m3{
  right:-2%;
  border-width:0 70px 85px 70px;
  border-color:transparent transparent #3a5f7f transparent;
}

.cloud{
  position:absolute;
  width:90px;
  height:22px;
  border-radius:30px;
  background:rgba(255,255,255,.75);
  box-shadow:0 4px 10px rgba(0,0,0,.08);

}

.cloud:before,
.cloud:after{

  position:absolute;
  border-radius:50%;
  background:inherit;
}

.cloud:before{
  width:36px;
  height:36px;
  left:12px;
  bottom:0;
}

.cloud:after{
  width:29px;
  height:29px;
  right:13px;
  bottom:0;
}

.cloud1{
  top:48px;
  left:8%;
  animation-duration:26s;
}

.cloud2{
  top:95px;
  right:22%;
  transform:scale(.6);
  opacity:.85;
  animation-duration:19s;
  animation-direction:reverse;
}

@keyframes cloudDrift{
  from{ transform:translateX(-20px); }
  to{ transform:translateX(20px); }
}

/* GRAMA */

.ground{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:54%;
  background:
    radial-gradient(circle, rgba(255,255,255,.35) 0 2px, transparent 3px) 6% 20%/60px 60px,
    radial-gradient(circle, rgba(255,255,255,.3) 0 2px, transparent 3px) 40% 65%/70px 70px,
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.05) 0 10px,
      rgba(255,255,255,.03) 10px 20px
    );
}

.flower{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  box-shadow:
    0 -6px 0 -1px currentColor,
    0 6px 0 -1px currentColor,
    -6px 0 0 -1px currentColor,
    6px 0 0 -1px currentColor;
}

.tree-line{
  position:absolute;
  left:0;
  right:0;
  bottom:46%;
  height:14px;
  background:
    radial-gradient(circle, #2f4d29 0 7px, transparent 8px) 0 0/34px 100%,
    radial-gradient(circle, #375a30 0 7px, transparent 8px) 17px 2px/34px 100%;
  opacity:.7;
}

/* PISTA RETA */

.road{
  position:absolute;
  left:8%;
  right:8%;
  top:43%;
  bottom:0;

    linear-gradient(90deg, rgba(255,255,255,.05) 0%, transparent 12%, transparent 88%, rgba(255,255,255,.05) 100%),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.03) 0 22px,
      rgba(0,0,0,.05) 22px 44px
    ),
    linear-gradient(180deg, #3a4550 0%, #262c33 100%);

    inset 0 0 40px rgba(0,0,0,.2);
}

/* BEIRADAS DA PISTA */

.road-edge{
  position:absolute;
  top:43%;
  bottom:0;
  width:8px;
  z-index:3;
  background:
    repeating-linear-gradient(
      0deg,
      #fbfbfb 0 24px,
      #e14444 24px 48px
    );
  box-shadow:0 0 10px rgba(0,0,0,.4);
}

.road-edge.left{
  left:8%;
}

.road-edge.right{
  right:8%;
}

/* FAIXAS */

.lane{
  position:absolute;
  top:43%;
  bottom:0;
  width:4px;
  z-index:2;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,224,120,.85) 0 35px,
      transparent 35px 70px
    );
  filter:drop-shadow(0 0 3px rgba(255,224,120,.4));
}

.lane.one{
  left:38%;
}

.lane.two{
  left:62%;
}

/* DETALHES LATERAIS */

.side{
  position:absolute;
  top:43%;
  bottom:0;
  width:8%;
  z-index:1;
  overflow:hidden;
}

.side.left{
  left:0;
}

.side.right{
  right:0;
}

.post{
  position:absolute;
  width:4px;
  height:55px;
  background:linear-gradient(180deg,#eee,#c9c9c9);
  bottom:-60px;
  animation:postMove .9s linear infinite;
  box-shadow:0 0 4px rgba(0,0,0,.3);
}

.post:after{
  content:"";
  position:absolute;
  width:22px;
  height:4px;
  top:8px;
  left:-9px;
  background:linear-gradient(90deg,#eee,#c9c9c9);
}

.side.left .post{
  left:55%;
}

.side.right .post{
  right:55%;
}

@keyframes postMove{
  from{
    transform:translateY(-80px);
  }

  to{
    transform:translateY(480px);
  }
}

/* SOMBRA DO PERSONAGEM */

.player-shadow{
  position:absolute;
  z-index:9;
  width:46px;
  height:14px;
  left:50%;
  bottom:26px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 72%);
  transition:left .14s ease, width .2s ease, opacity .2s ease;
}

/* PERSONAGEM */

.player{
  position:absolute;
  z-index:10;
  width:62px;
  height:88px;
  left:50%;
  bottom:32px;
  transform:translateX(-50%);
  transition:left .14s ease, bottom .18s ease;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));
}

.scarf{
  position:absolute;
  width:22px;
  height:14px;
  left:5px;
  top:26px;
  background:linear-gradient(135deg,#ff6b6b,#e14444);
  border-radius:0 10px 10px 0;
  z-index:1;
  animation:scarfWave .35s ease-in-out infinite alternate;
  transform-origin:right center;
}

@keyframes scarfWave{
  from{ transform:rotate(6deg); }
  to{ transform:rotate(-10deg); }
}

.head{
  position:absolute;
  width:27px;
  height:27px;
  left:18px;
  top:2px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #f2b688, #d89a6b 70%);
  z-index:3;
  box-shadow:inset -3px -2px 0 rgba(0,0,0,.12);
}

.hair{
  position:absolute;
  width:29px;
  height:13px;
  left:17px;
  top:0;
  border-radius:14px 14px 6px 6px;
  background:linear-gradient(180deg,#2d3440,#1a1f26);
  z-index:4;
}

.eye{
  position:absolute;
  width:3px;
  height:3px;
  top:14px;
  background:#222;
  border-radius:50%;
}

.eye.left{
  left:25px;
}

.eye.right{
  left:35px;
}

.body{
  position:absolute;
  width:36px;
  height:43px;
  left:13px;
  top:27px;
  border-radius:10px 10px 7px 7px;
  background:linear-gradient(
    160deg,
    #5cb6f0,
    #397fb2 60%,
    #2e6690
  );
  box-shadow:0 6px 12px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.25);
}

.backpack{
  position:absolute;
  width:12px;
  height:30px;
  left:7px;
  top:31px;
  border-radius:7px;
  background:linear-gradient(180deg,#333c48,#1c222b);
  z-index:-1;
}

.arm{
  position:absolute;
  width:9px;
  height:31px;
  top:31px;
  border-radius:8px;
  background:linear-gradient(180deg,#f2b688,#d89a6b);
  transform-origin:top center;
}

.arm.left{
  left:7px;
  transform:rotate(18deg);
}

.arm.right{
  right:7px;
  transform:rotate(-18deg);
}

.leg{
  position:absolute;
  width:11px;
  height:31px;
  top:66px;
  border-radius:8px;
  background:linear-gradient(180deg,#2d3440,#1a1f26);
  transform-origin:top center;
}

.leg.left{
  left:17px;
  transform:rotate(8deg);
}

.leg.right{
  right:17px;
  transform:rotate(-8deg);
}

.shoe{
  position:absolute;
  width:18px;
  height:8px;
  bottom:-4px;
  border-radius:8px;
  background:linear-gradient(180deg,#fff,#e6e6e6);
  box-shadow:0 2px 3px rgba(0,0,0,.25);
}

.leg.left .shoe{
  left:-5px;
}

.leg.right .shoe{
  right:-5px;
}

/* ANIMAÇÃO CORRENDO */

.player.running .arm.left{
  animation:armLeft .28s infinite alternate;
}

.player.running .arm.right{
  animation:armRight .28s infinite alternate;
}

.player.running .leg.left{
  animation:legLeft .28s infinite alternate;
}

.player.running .leg.right{
  animation:legRight .28s infinite alternate;
}

.player.running .scarf{
  animation-duration:.22s;
}

@keyframes armLeft{
  from{transform:rotate(25deg)}
  to{transform:rotate(-25deg)}
}

@keyframes armRight{
  from{transform:rotate(-25deg)}
  to{transform:rotate(25deg)}
}

@keyframes legLeft{
  from{transform:rotate(20deg)}
  to{transform:rotate(-20deg)}
}

@keyframes legRight{
  from{transform:rotate(-20deg)}
  to{transform:rotate(20deg)}
}

.player.jumping{
  filter:drop-shadow(0 18px 10px rgba(0,0,0,.18));
}

/* BARREIRA */

.barrier{
  position:absolute;
  z-index:8;
  width:60px;
  height:44px;
  top:-60px;
  transform:translateX(-50%);
  border-radius:6px;
  background:
    repeating-linear-gradient(
      135deg,
      #f2574c 0 10px,
      #ffd35c 10px 20px
    );
  border:3px solid #201f1f;
  box-shadow:
    0 8px 14px rgba(0,0,0,.45),
    inset 0 3px 0 rgba(255,255,255,.4),
    inset 0 -4px 0 rgba(0,0,0,.15);
}

.barrier:before{
  content:"";
  position:absolute;
  left:6px;
  right:6px;
  top:6px;
  height:6px;
  border-radius:4px;
  background:rgba(255,255,255,.35);
}

.barrier:after{
  content:"";
  position:absolute;
  width:7px;
  height:18px;
  left:8px;
  bottom:-18px;
  background:#201f1f;
  box-shadow:37px 0 #201f1f, 0 2px 4px rgba(0,0,0,.3), 37px 2px 4px rgba(0,0,0,.3);
}

/* MOEDA */

.coin{
  position:absolute;
  z-index:8;
  width:30px;
  height:30px;
  top:-50px;
  transform:translateX(-50%);
  border-radius:50%;
  border:4px solid #ffd84d;
  background:
    radial-gradient(
      circle at 38% 32%,
      #fffceb 0 12%,
      #fff2a3 13% 40%,
      #ffc928 41% 70%,
      #e07f0f 71% 100%
    );
  box-shadow:
    0 0 16px rgba(255,210,50,.7),
    0 6px 10px rgba(0,0,0,.3),
    inset 0 2px 2px rgba(255,255,255,.6);
  animation:coinSpin .5s linear infinite, coinBob .5s ease-in-out infinite;
}

@keyframes coinSpin{
  0%{
    transform:translateX(-50%) rotateY(0deg);
  }
  50%{
    transform:translateX(-50%) rotateY(90deg);
  }
  100%{
    transform:translateX(-50%) rotateY(180deg);
  }
}

@keyframes coinBob{
  0%,100%{ margin-top:0; }
  50%{ margin-top:-4px; }
}

/* EFEITOS */

.sparkle{
  position:absolute;
  z-index:15;
  pointer-events:none;
  font-size:16px;
  animation:sparklePop .55s ease-out forwards;
}

@keyframes sparklePop{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.4) rotate(0deg);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-140%) scale(1.15) rotate(45deg);
  }
}

.popup{
  position:absolute;
  z-index:16;
  pointer-events:none;
  font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#ffe08a;
  text-shadow:0 2px 4px rgba(0,0,0,.5);
  animation:popupRise .7s ease-out forwards;
}

@keyframes popupRise{
  0%{
    opacity:1;
    transform:translate(-50%,0);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-40px);
  }
}

/* HUD */

.hud{
  position:absolute;
  z-index:20;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.hud-box{
  padding:7px 12px;
  border-radius:10px;
  background:linear-gradient(135deg, rgba(20,26,34,.68), rgba(20,26,34,.5));
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(6px);
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.hud-label{
  font-size:7px;
  color:rgba(255,255,255,.6);
  font-weight:800;
  letter-spacing:1px;
}

.hud-value{
  font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#fff;
  text-shadow:0 0 8px rgba(255,255,255,.25);
}

/* MENU */

.message{
  position:absolute;
  z-index:30;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:radial-gradient(circle at 50% 30%, rgba(35,50,70,.85), rgba(6,10,15,.88));
  backdrop-filter:blur(5px);
}

.message.hidden{
  display:none;
}

.message-title{
  font-size:28px;
  font-weight:900;
  color:#fff;
  text-shadow:0 0 18px rgba(255,224,138,.5);
  animation:titleFloat 2.2s ease-in-out infinite;
}

@keyframes titleFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-5px); }
}

.message-sub{
  margin-top:8px;
  max-width:280px;
  font-size:11px;
  line-height:1.5;
  color:rgba(255,255,255,.7);
}

/* CONTROLES */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.control{
  min-height:50px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:11px;
  color:#fff;
  background:linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.04));
  font-size:20px;
  font-weight:900;
  touch-action:manipulation;
  transition:transform .1s ease, background .15s ease;
}

.control:active{
  transform:scale(.93);
  background:rgba(255,255,255,.18);
}

.start{
  grid-column:1 / 4;
  background:linear-gradient(
    135deg,
    var(--accent-a),
    var(--accent-b)
  );
  font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
}
</style>

              PONTOS
            </div>

            <div class="hud-value" id="score">
              0
            </div>

          </div>

          <div class="hud-box">

            <div class="hud-label">
              🪙 MOEDAS
            </div>

            <div class="hud-value" id="coins">
              0
            </div>

          </div>

        </div>

        <div class="player-shadow" id="playerShadow"></div>

        <div class="player" id="player">

          <div class="scarf"></div>

          <div class="backpack"></div>

          <div class="hair"></div>
          <div class="head"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="body"></div>

          <div class="arm left"></div>
          <div class="arm right"></div>

          <div class="leg left">
            <div class="shoe"></div>
          </div>

          <div class="leg right">
            <div class="shoe"></div>
          </div>

        </div>

        <div class="message" id="message">

          <div class="message-title" id="messageTitle">
            🏃 SURF RUN
          </div>

          <div class="message-sub" id="messageSub">
            Desvie das barreiras e pegue as moedas!
          </div>

          <button
            class="button primary"
            id="start"
            style="margin-top:18px"
          >
            ▶️ COMEÇAR
          </button>

        </div>

      </div>

      <div class="controls">

        <button class="control" id="left">
          ◀️
        </button>

        <button class="control" id="jump">
          ⬆️
        </button>

        <button class="control" id="right">
          ▶️
        </button>

      </div>

    </div>

  </div>

</div>

<script>

(function(){

  const game =
    document.getElementById("game");

  const player =
    document.getElementById("player");

  const playerShadow =
    document.getElementById("playerShadow");

  const startButton =
    document.getElementById("start");

  const leftButton =
    document.getElementById("left");

  const rightButton =
    document.getElementById("right");

  const jumpButton =
    document.getElementById("jump");

  const message =
    document.getElementById("message");

  const messageTitle =
    document.getElementById("messageTitle");

  const messageSub =
    document.getElementById("messageSub");

  const scoreElement =
    document.getElementById("score");

  const coinsElement =
    document.getElementById("coins");

  const statusElement =
    document.getElementById("status");

  let running = false;

  let lane = 1;

  let score = 0;

  let coins = 0;

  let objects = [];

  let lastTime = 0;

  let spawnTimer = 0;

  let jumpTimer = null;

  const lanes = [
    24,
    50,
    76
  ];

  function setLane(){

    player.style.left =
      lanes[lane] + "%";

    playerShadow.style.left =
      lanes[lane] + "%";

  }

  function updateHud(){

    scoreElement.textContent =
      Math.floor(score);

    coinsElement.textContent =
      coins;

  }

  function clearObjects(){

    objects.forEach(function(object){

      if(object.element){
        object.element.remove();
      }

    });

    objects = [];

  }

  function spawnSparkle(x,y){

    const sparkle =
      document.createElement("div");

    sparkle.className =
      "sparkle";

    sparkle.textContent =
      "✨";

    sparkle.style.left =
      x + "px";

    sparkle.style.top =
      y + "px";

    game.appendChild(sparkle);

    setTimeout(function(){
      sparkle.remove();
    }, 550);

  }

  function spawnPopup(x,y,text){

    const popup =
      document.createElement("div");

    popup.className =
      "popup";

    popup.textContent =
      text;

    popup.style.left =
      x + "px";

    popup.style.top =
      y + "px";

    game.appendChild(popup);

    setTimeout(function(){
      popup.remove();
    }, 700);

  }

  function startGame(){

    clearObjects();

    lane = 1;

    score = 0;

    coins = 0;

    spawnTimer = 0;

    setLane();

    updateHud();

    running = true;

    statusElement.textContent =
      "RUNNING";

    message.classList.add("hidden");

    player.classList.add("running");

    playerShadow.style.opacity =
      "1";

    lastTime =
      performance.now();

    requestAnimationFrame(loop);

  }

  function gameOver(){

    running = false;

    player.classList.remove("running");

    statusElement.textContent =
      "GAME OVER";

    messageTitle.textContent =
      "💥 GAME OVER";

    messageSub.textContent =
      "Você fez " +
      Math.floor(score) +
      " pontos e pegou " +
      coins +
      " moedas!";

    startButton.textContent =
      "🔄 JOGAR NOVAMENTE";

    message.classList.remove("hidden");

    game.classList.add("shake");

    setTimeout(function(){
      game.classList.remove("shake");
    }, 350);

  }

  function moveLeft(){

    if(!running){
      return;
    }

    if(lane > 0){

      lane--;

      setLane();

    }

  }

  function moveRight(){

    if(!running){
      return;
    }

    if(lane < 2){

      lane++;

      setLane();

    }

  }

  function jump(){

    if(!running){
      return;
    }

    if(player.classList.contains("jumping")){
      return;
    }

    player.classList.add("jumping");

    player.style.bottom =
      "125px";

    playerShadow.style.width =
      "30px";

    playerShadow.style.opacity =
      ".45";

    clearTimeout(jumpTimer);

    jumpTimer =
      setTimeout(function(){

        player.classList.remove("jumping");

        player.style.bottom =
          "32px";

        playerShadow.style.width =
          "46px";

        playerShadow.style.opacity =
          "1";

      }, 650);

  }

  function spawnObject(){

    const isCoin =
      Math.random() < 0.38;

    const element =
      document.createElement("div");

    const objectLane =
      Math.floor(
        Math.random() * 3
      );

    element.style.left =
      lanes[objectLane] + "%";

    if(isCoin){

      element.className =
        "coin";

    }else{

      element.className =
        "barrier";

    }

    game.appendChild(element);

    objects.push({

      element:element,

      lane:objectLane,

      y:-60,

      type:isCoin
        ? "coin"
        : "barrier"

    });

  }

  function collision(object){

    if(object.lane !== lane){
      return false;
    }

    const playerRect =
      player.getBoundingClientRect();

    const objectRect =
      object.element.getBoundingClientRect();

    const hit =
      playerRect.left <
      objectRect.right &&
      playerRect.right >
      objectRect.left &&
      playerRect.top <
      objectRect.bottom &&
      playerRect.bottom >
      objectRect.top;

    if(!hit){
      return false;
    }

    if(object.type === "coin"){

      coins++;

      score += 100;

      const gameRect =
        game.getBoundingClientRect();

      const px =
        objectRect.left - gameRect.left + objectRect.width / 2;

      const py =
        objectRect.top - gameRect.top + objectRect.height / 2;

      spawnSparkle(px,py);

      spawnPopup(px,py,"+100");

      object.element.remove();

      return "coin";

    }

    if(
      player.classList.contains("jumping")
    ){

      return false;

    }

    return true;

  }

  function updateObjects(delta){

    const movement =
      (125 + score / 35) *
      delta;

    for(
      let i = objects.length - 1;
      i >= 0;
      i--
    ){

      const object =
        objects[i];

      object.y += movement;

      object.element.style.top =
        object.y + "px";

      if(
        object.y >
        game.clientHeight + 80
      ){

        object.element.remove();

        objects.splice(i,1);

        continue;

      }

      const result =
        collision(object);

      if(result === "coin"){

        objects.splice(i,1);

        continue;

      }

      if(result === true){

        gameOver();

        return;

      }

    }

  }

  function loop(timestamp){

    if(!running){
      return;
    }

    const delta =
      Math.min(
        (timestamp - lastTime) / 1000,
        0.05
      );

    lastTime = timestamp;

    score +=
      delta * 12;

    spawnTimer += delta;

    /*
     * Jogo propositalmente fácil:
     * obstáculos aparecem com bastante espaço.
     */

    if(spawnTimer >= 1.15){

      spawnTimer = 0;

      spawnObject();

    }

    updateObjects(delta);

    updateHud();

    requestAnimationFrame(loop);

  }

  document.addEventListener(
    "keydown",
    function(event){

      if(event.key === "ArrowLeft"){
        event.preventDefault();
        moveLeft();
      }

      if(event.key === "ArrowRight"){
        event.preventDefault();
        moveRight();
      }

      if(
        event.key === "ArrowUp" ||
        event.key === " "
      ){
        event.preventDefault();
        jump();
      }

    }
  );

  leftButton.addEventListener(
    "click",
    moveLeft
  );

  rightButton.addEventListener(
    "click",
    moveRight
  );

  jumpButton.addEventListener(
    "click",
    jump
  );

  startButton.addEventListener(
    "click",
    startGame
  );

  setLane();

  updateHud();

})();

</script>
